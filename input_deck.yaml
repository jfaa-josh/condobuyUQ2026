# =============================================================================
# condobuyUQ2026 — Input Deck
# =============================================================================
# The single user-editable file describing the buy-vs-rent decision.
#
# STATUS: mostly illustrative example values now (not real elicited data — see each
# comment), so the deck can be run end to end. `# REQUIRED` still marks a real gap.
# See .claude/implementation-plan.md for stage, earmarks, and open questions.
#
# -----------------------------------------------------------------------------
# Schema reference
# -----------------------------------------------------------------------------
# WHAT THIS DECK COMPUTES: uncertainty propagation (forward UQ), not Bayesian inference —
# no posterior anywhere. Every input here feeds a deterministic formula whose OUTPUT is the
# actual quantity of interest: ΔW = W_buy − W_rent at the horizon.
#
# KIND:
#   constant   single known value.                fields: value
#   sweep      decision variable, grid axis.       fields: values
#   prior      ONE uncertain value, static.        fields: dist, <dist params>, latent
#   process    an entire time-evolving path, hand-elicited (dist/marginal params + monthly_change
#              inline) — not currently used by any forecast_models entry (all three are fitted now,
#              see below), kept here in case a future one goes back to being hand-elicited.
#
# All three founding processes (see below) have no `kind` at all: they're FITTED from real data
# instead of hand-elicited, so they carry none of the above fields — just `model_name`, naming an
# already-built model fit (see input_deck.py's get_forecast_model_general/
# get_forecast_model_home_price/get_forecast_model_market).
#
# DIST families: lognormal {median, cv} (positive quantities), normal {mean, sd} (can go
# negative — used for monthly_change blocks). (Rare events like special assessments don't use a
# dist family -- see carrying_costs.special_assessment's own frequency_severity shape.)
#
# SWEEPS ARE DELIBERATELY MINIMAL: only `scenario.alternatives`, `scenario.horizon_years`,
# `scenario.residency_state`, `scenario.purchase_price` and `scenario.family_loan_repaid_at_sale`
# are swept. Everything else is a single manually-set value per run.
#
# "SEE scenario.X" STUB PATTERN: `purchase_price` is actually swept in `scenario` (kept
# together with the other sweeps for visibility), but conceptually belongs to `acquisition`.
# That section keeps a named placeholder entry (`values: null # see scenario.purchase_price`)
# purely so the variable is discoverable when reading that section — the real input lives in
# `scenario`, don't set it in both places.
#
# ALWAYS SELLS AT THE HORIZON: not a toggle. Both branches are liquidated at exit_year — the
# buy branch sells the condo, the rent branch's invested portfolio is also sold — because
# taxing both liquidations (capital gains on the portfolio too, not just the condo) is what
# makes ΔW an apples-to-apples comparison. See scenario.horizon_years and the exit section.
#
# HOW ΔW IS BUILT (no inputs of its own; the ΔW stage reads every section below):
#   ΔW = net equity at the sale (section 12) - the invested portfolio (section 11) - the DIFFERENCE FUND.
# BUDGET MATCHING: both households have the same income and invest whatever they don't spend, so savings
# you'd make either way cancel out exactly. Only the monthly SPENDING GAP matters: mortgage + carrying
# costs + alternate lodging + the condo's income-tax effect + furnishing - net rental income - the lease.
# Whichever household spends less invests the gap in the same portfolio as section 11; the "difference
# fund" tracks that. Its interest, dividends and gains are taxed on the return of the household that
# holds it (with the condo on the owner's return, with the portfolio on the renter's), every year, and
# when it's sold at the horizon. ASSUMPTION: the savings both households make anyway are taxed alike in
# both (no savings input; user, 2026-11-25). Results: results/<scenario>/delta_w/.
#
# THREE FOUNDING PROCESSES (`forecast_models`: general, home_price, market) — all fitted from real
# historical data (see KIND above) as annualized GROWTH RATES (BLS CPI, a Denver-metro home price
# index, S&P 500 price — see the "annualized rate" note below). Treated as ground truth; nothing
# else in this deck feeds back and influences them.
#
# REFERENCING A PROCESS/DERIVED LATENT BY NAME: everywhere a `latent:` or `derived_latents.*.
# weights` key names a process (e.g. `market`, `construction_cost`, `general`), it's always that
# entry's own key under forecast_models/derived_latents — never a separate identifier declared on
# the entry itself.
#
# DERIVED LATENTS (`derived_latents`): for anything that needs a growth or level driver but
# isn't itself one of the three founding processes — a weighted combination of all three
# (`market`, `home_price`, `general`) plus its own idiosyncratic (unmodeled) share,
# `a²+b²+c² ≤ 1`. Deliberately kept as manually-reasoned weights for now — see the earmark
# in the implementation plan to fit these properly from real data with a utility script.
#
# `growth` sub-blocks are elicited as an ANNUAL median/cv, realized monthly internally, and COMPOUND
# over the horizon. Two shapes exist:
#   - `carrying_costs`'s five entries (`hoa_dues_annual`/`insurance_annual`/`maintenance_annual`/
#     `special_assessment`/`utilities`): `growth:` names ONLY a `latent:` — no separate `dist`/
#     `median`/`cv` of its own. The named latent's own already-fitted process supplies both the mean
#     growth and how its uncertainty widens/mean-reverts (see that section's header comment).
#   - `rental_operations.adr_growth_latent`, `personal_use.alternate_lodging_growth_latent` and
#     `rent_reference.lease_growth_latent`: same idea, just the latent's name (no dist/median/cv).
#
# COMPOSITE COST FORMULAS (`acquisition.purchase_closing_costs`, `exit.selling_costs`): both follow
# `total = fixed_fees + (percent_of_price * price)` — a scalar dollar amount that doesn't scale
# with price, plus a fraction that does. Written out explicitly in each section's comment.
#
# `derived` variables (loan_amount, loan_occupancy_class, tax_use_class, exit_year,
# monthly rentable-nights) are computed by the script and deliberately do
# NOT appear in this deck.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. scenario
# -----------------------------------------------------------------------------
# Every sweep in this deck lives here: alternatives x horizon_years x residency_state x
# purchase_price is the full run — watch the combined count as you add values to any of these.
scenario:
  reference:
    # Baseline being compared against. OPTIONS: rent (fixed).
    kind: constant
    value: rent

  alternatives:
    # OPTIONS: buy.
    kind: sweep
    values: [buy]

  horizon_years:
    # Years held before both branches cash out. ALWAYS ends in a sale/liquidation at exit_year —
    # not a toggle (see the "ALWAYS SELLS AT THE HORIZON" note in the schema reference above):
    # the buy branch sells the condo AND the rent branch's portfolio is liquidated, both taxed,
    # so the comparison is apples-to-apples rather than favoring whichever side doesn't realize
    # its gains.
    kind: sweep
    values: [1, 5, 10]

  residency_state:
    # Tax domicile (categorical). OPTIONS: FL | CO (any state with a data/tax_jurisdictions/<STATE>/
    # state.yaml). Applies to both branches symmetrically: your residence state's income tax is
    # loaded from that file (FL: none) -- see the taxes section.
    kind: sweep
    values: [FL]

  property_state:
    # Where the condo (or the rent branch's comparable place) sits. Fixed for this scenario.
    kind: constant
    value: CO

  purchase_price:
    # Purchase price (USD) — the deck's actual input for this; see the "SEE scenario.X" note
    # above. acquisition.purchase_price is a discoverability stub only.
    kind: sweep
    values: [375000, 400000]

  family_loan_repaid_at_sale:
    # Is acquisition.family_loan paid back out of the sale proceeds at the horizon? (true/false)
    # true: the buy branch's money at the sale is reduced by the full loan (0% interest, so just the
    # amount borrowed). false: it's never repaid within the model (e.g. forgiven, or repaid later
    # from other money). Only the buy branch is affected (the rent branch never takes the loan), so
    # listing both values doubles the buy scenarios but not the rent cases.
    kind: sweep
    values: [true]                   # example; [true, false] runs both

  closing_month:
    # Month (1-12) the purchase closes. Together with closing_year below, this is TIMESTEP 0 for
    # every month-indexed model in this deck (currently just carrying_costs.property_tax.
    # market_value's own stair-step -- see that field's own comment) -- everything else still only
    # ever tracks integer months FROM this point, never a real calendar date beyond it. closing_
    # month/year exist only so a calculation that genuinely needs to know a REAL calendar month
    # (e.g. how many months until reassessment year 1's January, or which historical month a
    # pre-closing data lookup needs) has a fixed reference point to count from.
    kind: constant
    value: 10                      # example — October
  closing_year:
    kind: constant
    value: 2026                    # example

# -----------------------------------------------------------------------------
# 2. forecast_models
# -----------------------------------------------------------------------------
# The three founding processes. All fitted from real data (BLS CPI, a Denver-metro Case-Shiller
# home price index, S&P 500 price) and modeled as ANNUALIZED GROWTH RATES (see the "annualized
# rate" note just below).
#
# IMPORTANT — annualized rate, but a MONTHLY-stepped process: the growth rate's own distribution is
# on an ANNUALIZED basis (e.g. median 0.03 = "running about 3%/year") — that's the natural, human-
# elicited way to state it, or what these fits are expressed in (see their own comments below). But
# each process's path is a MONTHLY AR(1) walk (see "Temporal model" in
# .claude/implementation-plan.md): the fit's equivalent of `monthly_change` is how much that
# ANNUALIZED-RATE ESTIMATE itself typically drifts from one month's reading to the next's — that's
# what phi gets fit from — it is NOT the amount actually applied to grow a variable's IC in a
# single month. When this growth compounds an IC forward, each of the 12 monthly steps in a year
# must apply the MONTHLY-EQUIVALENT of the annual rate (the twelve steps compound TO the annual
# rate), never the full annual figure at every one of the 12 steps — that would compound to twelve
# years of growth in one. The exact monthly-step formula given phi is still open — see
# "Calibration procedure" under Open questions in the implementation plan.
forecast_models:
  general:
    # General (broad US urban consumer) CPI inflation, expressed as an ANNUALIZED rate — see the
    # forecast_models header note above for what that means for how this actually steps monthly.
    # Covers CPI-U, all items, not seasonally adjusted. Does NOT cover Summit-County-specific costs
    # (see home_price) or this property's own utility/HOA cost drivers (those are their own
    # derived_latents entries, e.g. construction_cost/insurance/maintenance).
    #
    # This one and home_price below are FITTED from real data rather than hand-elicited: model_name
    # just names a fit already built and saved by run/manual/build_general_price_model.py to
    # models/<model_name>/fit.json (see input_deck.py's get_forecast_model_general and
    # .claude/implementation-plan.md's Earmarks for how the fit's OU parameters map onto this
    # model). No kind/dist/mean/sd/monthly_change here -- they come from the fit, not the deck.
    model_name: bls_cpi_all_nsa_1984_1_2026_8

  home_price:
    # Local Denver-METRO home price appreciation (fraction/year), NOT national CPI and NOT
    # Summit-County/Keystone-specific (no dedicated mountain-resort-town index exists -- treated as
    # the best available proxy). Used directly (unweighted) to appreciate acquisition.purchase_price
    # to its sale value at exit -- see exit section.
    #
    # FITTED from real FRED data (S&P/Case-Shiller Denver-Metro HPI, NSA) -- see general's comment
    # above for what that means; fit built and saved by run/manual/build_co_home_price_model.py.
    model_name: fred_denver_homes_1987_1_2026_8

  market:
    # Broad portfolio return (fraction/year) — the rent branch's opportunity-cost engine. This
    # IS capital_markets' "market_return"; not re-declared there, to avoid two copies of the
    # same numbers. PRICE return only (no dividends) -- see build_market_model.py's own docstring
    # for why that's a known, deliberate understatement of real portfolio growth, not an oversight.
    #
    # FITTED from real Yahoo Finance data (S&P 500, ^GSPC) -- see general's comment above for what
    # that means; fit built and saved by run/manual/build_market_model.py.
    model_name: yfinance_spx_1984_1_2026_9

# -----------------------------------------------------------------------------
# 3. derived_latents
# -----------------------------------------------------------------------------
# For anything that needs a growth or level driver but isn't itself a founding process:
# construction_cost and insurance drive both a LEVEL and a GROWTH role (see their own comments
# below); maintenance drives a LEVEL only; adr and utilities each drive a GROWTH only (their LEVEL/
# seasonal shape comes from rental_operations.sources / carrying_costs.utilities). Each entry is a weighted combination of all three forecast_models' own standardized
# monthly paths -- referenced by their own key (`market`/`home_price`/`general`), same as
# everywhere else in this deck (see "Referencing a process/derived latent by name" above), not a
# separate `z_*` identifier -- plus an idiosyncratic share, for latent X with weights {a, b, c}:
#
#   X_t = a*market_t + b*home_price_t + c*general_t + sqrt(1 - a^2 - b^2 - c^2)*shock_idio_t
#
# a^2+b^2+c^2 <= 1 (checked by input_deck.py's get_derived_latents); the shortfall is X's own
# idiosyncratic (unmodeled, i.i.d. each month, no persistence of its own) variance. EARMARKED (see
# implementation plan): weights below are manually reasoned placeholders; the plan is to build
# these properly in an offline utility script (with visualizations) against real occupancy/ADR/
# utilities data, and import the result here instead of hand-setting weights.
#
# ASSUMPTION (stated 2026-11-25, flagged to revisit later): the three founding processes are treated
# as UNCORRELATED with each other (that's what makes sqrt(1 - a^2 - b^2 - c^2) the right idiosyncratic
# share). History disagrees a little: annual log changes 1987-2026 (39 non-overlapping years)
# correlate home_price-market +0.27, general-market +0.08, general-home_price -0.01. Using them would
# narrow the buy-vs-rent spread (sale price vs portfolio partly cancel) and tie adr more to the stock
# market. Deliberately deferred: see the implementation plan, "To raise once the GUI is wired".
derived_latents:
  construction_cost:
    # Drives hoa_dues_annual's and special_assessment's (size scenarios') GROWTH -- their multi-year
    # drift, not their own year-to-year LEVEL deviation (see carrying_costs section's own header
    # comment for why there's no longer a LEVEL-driving latent on either).
    weights:
      market: 0.0                     # REQUIRED (placeholder) — 0 to 1 each, sum of squares <= 1
      home_price: 0.6
      general: 0.4

  insurance:
    # Drives insurance_annual's GROWTH (same role as construction_cost's, see that entry's comment).
    weights:
      market: 0.0
      home_price: 0.9
      general: 0.1

  maintenance:
    # Drives maintenance_annual's growth (see carrying_costs section).
    weights:
      market: 0.0
      home_price: 0.5
      general: 0.5

  adr:
    # Drives adr's GROWTH (secular pricing power) — adr's LEVEL/seasonal shape is fitted from
    # rental_operations.sources (see rental_operations.adr_growth_latent). ALSO reused for rent_reference.
    # lease_cost_by_month's growth (rent_reference.lease_growth_latent) and personal_use.
    # alternate_lodging_cost_by_month's growth (personal_use.alternate_lodging_growth_latent) — same
    # rental market, so the same
    # pricing-power process applies to all three.
    weights:
      market: 0.2
      home_price: 0.5
      general: 0.3

  utilities:
    # Drives utilities' GROWTH — utilities' LEVEL/seasonal shape is just its own `months:` map.
    weights:
      market: 0.3
      home_price: 0.0
      general: 0.7

# -----------------------------------------------------------------------------
# 4. acquisition
# -----------------------------------------------------------------------------
acquisition:
  purchase_price:
    # STUB — actual input lives in scenario.purchase_price (a sweep). Kept here only so this
    # variable is discoverable when reading this section; do not set values here.
    kind: sweep
    values: null                     # see scenario.purchase_price

  purchase_closing_costs:
    # total = fixed_fees + (percent_of_price * purchase_price). Named "purchase_" (not just
    # "closing_costs") to stay unambiguous against exit.selling_costs, which is the sell-side
    # closing costs. Does NOT include a property-tax proration credit -- see the ASSUMPTION note at
    # the top of carrying_costs.property_tax for why that's deliberately left out.
    # fixed_fees: dollar costs independent of price (title insurance, escrow, recording,
    #   attorney fees, etc.). percent_of_price: costs that scale with price (loan origination
    #   points, transfer tax, etc.).
    fixed_fees:
      kind: constant
      value: 2500                    # example
    percent_of_price:
      kind: constant
      value: 0.0                   # example — 1.5%

  percent_improved:
    # "% Improved" from the property/listing sheet (percent, 0-100): the share of the value that is
    # the building (improvements) rather than land. Only the building can be depreciated for taxes, so
    # the depreciable basis is percent_improved% of (purchase_price + purchase closing costs).
    # A condo sheet typically shows 100. If a sheet shows land and improvement values instead, enter
    # improvement / (land + improvement) x 100.
    kind: constant
    value: 100

  personal_cash_at_closing:
    # YOUR OWN money going toward closing (down payment, not from family_loan below) -- this IS the
    # rent branch's opportunity-cost capital (see capital_markets.initial_investment, which imports
    # this same value): unlike a family loan, your own cash wouldn't evaporate if you rented
    # instead, so it's what you'd invest in that branch. total_cash_outlay (DERIVED, see
    # acquisition.compute_acquisition_costs) = this + family_loan; the amount financed is DERIVED
    # from that: purchase_price + purchase_closing_costs.fixed_fees + (purchase_closing_costs.
    # percent_of_price * purchase_price) - total_cash_outlay.
    kind: constant
    value: 200000

  family_loan:
    # Money lent by family toward closing, at 0% interest (USD). Part of total_cash_outlay, so it
    # lowers the mortgage. Whether it's paid back at the sale is scenario.family_loan_repaid_at_sale
    # (a sweep). Never invested in the rent branch (see capital_markets.initial_investment).
    kind: constant
    value: 100000

  initial_furnishing:
    # One-time STR setup/furnishing cost (USD), scalar — a cash outlay only, not depreciated for
    # tax purposes (not a large enough amount to be worth the added complexity). Not the same
    # thing as any furnishing cost the rent branch might need (not currently modeled there).
    kind: constant
    value: 0

# -----------------------------------------------------------------------------
# 5. financing
# -----------------------------------------------------------------------------
# loan_occupancy_class (OPTIONS: primary_residence | second_home | investment) is DERIVED, not set
# here (see classification.get_loan_occupancy_class): primary_residence iff scenario.residency_
# state == scenario.property_state (a CO resident living in the CO property; FL residency can
# NEVER be primary, however many days you spend there); otherwise second_home if rental_operations.
# managed_by is "self" (you occupy it part of the year, no rental program/property manager
# controlling who stays there), or investment if managed_by is "company" (an STR run through a
# property manager is almost always this). "Second home" is really a LENDER term -- the tax code's
# own classification is tax_use_class below, decided by day counts, not by who manages the
# property or where you live.
financing:
  mortgage_rate:
    # One rate per loan_occupancy_class -- confirm with an actual lender; a half-year STR schedule
    # may push a self-managed property into "investment" territory regardless of intent (see
    # rental_operations.managed_by).
    primary_residence:
      kind: constant
      value: 0.0625
    second_home:
      kind: constant
      value: 0.065
    investment:
      kind: constant
      value: 0.0725                  # 0.5-1 point over second_home typical for STR (property manager)

  non_warrantable_premium:
    # Added ON TOP of whichever mortgage_rate above applies, if the condo project itself isn't
    # warrantable (Fannie/Freddie-eligible) -- 0.0 if it is (the common case; confirm with the
    # HOA/a lender before assuming otherwise).
    kind: constant
    value: 0.0

  loan_term_years:
    kind: constant
    value: 30

# -----------------------------------------------------------------------------
# 6. carrying_costs
# -----------------------------------------------------------------------------
# Every entry below except special_assessment starts from a single STARTING VALUE and grows it
# forward via a `growth: {latent: ...}` block naming ONLY a `latent:` (construction_cost/insurance/
# maintenance/utilities, per entry), never a separate growth `dist`/`median`/`cv`. The named latent's
# own fit (models/derived_variables/<latent>/fit.json, already built) supplies BOTH the mean growth
# AND how its own uncertainty widens over the horizon, via the exact closed-form machinery
# forecast_models already uses (ou_fitting.project_term_structure, p0 = the starting value above).
# Two kinds of starting value:
# - KNOWN (hoa_dues_annual, utilities): a real, currently-billed truth number -- 0% uncertain at
#   closing, the same role market_value.initial_price plays. No separate spread parameter at all --
#   ALL uncertainty comes purely from the latent's own growth process, which correctly starts at 0 at
#   h=0 and grows from there (an earlier design added a hand-picked `cv` as a CONSTANT extra
#   log-variance on top, which never actually shrank to 0 at h=0 the way the growth process itself
#   does -- see utils.prior_utils.build_hoa_dues_prior_model's own docstring for the full story).
# - GUESS (insurance_annual, maintenance_annual -- REDESIGNED 2026-09-30 to move insurance_annual
#   from KNOWN to this: a real current premium turned out to be an ESTIMATE too, not known truth data
#   the way HOA dues are): a genuine hand-elicited guess, since there's no real truth data for either.
#   Its own point-in-time uncertainty is DERIVED from the latent's own marginal/stationary rate
#   variance (see utils.prior_utils._build_guess_plus_growth_model) rather than a separately
#   hand-picked cv -- a CONSTANT term, not compounding with horizon.
#
# Built the same way `derived_latents` are (see that section) -- NOT read directly from the deck at
# runtime: utils.prior_utils.build_all_carrying_cost_prior_models combines each entry's starting value
# + growth latent into a saved projection (models/carrying_cost_priors/<name>/fit.json + plot),
# rebuilt automatically every time run/main.py runs (so an edit here always takes effect on the next
# run, without needing a separate manual step) -- carrying_costs.py then just loads the result.
carrying_costs:
  property_tax:
    # ASSUMPTION -- NO CLOSING-DAY PRORATION CREDIT IS MODELED: in a real CO closing, property tax
    # for a given tax year is billed the FOLLOWING year (2026's tax is billed in 2027), so at
    # closing the SELLER typically gives the BUYER a cash CREDIT for the seller's own prorated
    # share of the year up to the closing date -- since the buyer ends up the one who actually pays
    # the whole year's bill once it's billed. That credit would reduce total_cash_outlay at closing
    # (acquisition.py), not add to it. This model has NO such credit: it simply starts charging a
    # full 12 months of property_tax from closing_month/closing_year forward (see market_value
    # below), with nothing netted against acquisition costs for the partial first year the seller
    # actually owned. Decided 2026-09-28: left as-is deliberately -- acceptable for this model's
    # purpose, not an oversight. Revisit acquisition.purchase_closing_costs if precise closing-day
    # cash timing (rather than a reasonable rolling annual estimate) ever becomes the goal.
    #
    # THE MECHANIC COMES FROM THE PROPERTY'S STATE (taxes.jurisdiction.state), not from this deck: for CO,
    # data/tax_jurisdictions/CO/state.yaml's property_tax block -- each component's assessed value =
    # (market_value - its value reduction) x its assessment rate, then tax = assessed value x that
    # component's mill_levy. For 2026 on: local 6.8% after subtracting the lesser of 10% of value or
    # $70,000; school 7.05% of full value (HB24B-1001). Classification is residential: no current CO law
    # ties it to rental activity (HB24-1299 and SB24-033 both died in 2024). Only the combined total
    # (local + school) is passed on to a scenario. What stays HERE is property-specific: market_value
    # below and mill_levy (the parcel's own levies).
    market_value:
      # The COUNTY ASSESSOR'S OWN determination of market value for property-tax purposes -- NOT
      # the same thing as this model's own sale-price projection (carrying_costs.
      # project_condo_value_schedule, which tracks TRUE ongoing appreciation continuously via
      # forecast_models.home_price). Deliberately NOT the LEVEL+GROWTH pattern the other
      # carrying_costs entries use (no median/cv of its own).
      #
      # "REASSESSMENT" MEANS THE EFFECTIVE DATE THE NEW VALUE TAKES EFFECT FOR TAXES -- NOT the
      # window of real market data used to calculate it (that's a separate, automatically-derived
      # thing, explained below; you never set it directly). Concretely:
      #   - From closing until the next reassessment, the value is EXACTLY initial_price -- known,
      #     constant, no estimating happens for this stretch at all.
      #   - `first_reassessment_year` says WHEN (which January) the assessor's value NEXT changes:
      #     1 = the January immediately after closing_year; 2 = the January after that; etc. If
      #     closing falls INSIDE an already-active assessment cycle (the normal case -- e.g.
      #     closing partway through 2026, with a 2025-2026 cycle already live and reflected in
      #     initial_price), this must point to the NEXT cycle's own start, not the one already in
      #     effect -- closing Oct 2026 with a live 2025-2026 cycle means the next reassessment is
      #     Jan 2027, so first_reassessment_year=1 (a value of 2 would wrongly describe a cycle
      #     starting a year late, Jan 2028).
      #   - Every `reassessment_frequency_years` after that (2 years, Colorado's real cycle), the
      #     value changes again, the same way.
      #   - THE AVERAGING WINDOW ITSELF is NOT a separate input: it's always the first 18 months
      #     (1.5 years) of the reassessment_frequency_years-long period ENDING at that reassessment,
      #     derived automatically from the effective date -- e.g. a reassessment effective Jan 2025
      #     (2-year cycle) is based on averaging real market data from Jan 2023-Jun 2024. Whatever
      #     part of that derived window falls BEFORE closing uses REAL historical data; whatever
      #     part falls after closing uses `latent`'s own projected distribution -- so a window
      #     that's e.g. 80% already-recorded history only gets ~20% of a fully-projected window's
      #     uncertainty.
      #
      # FITTING/VALIDATION APPROACH (short version -- see utils.prior_utils.
      # fit_market_value_calibration for the full one): the Denver-metro home_price index supplies
      # the underlying TREND and its uncertainty (fit from real Denver data); a separate line
      # (slope + intercept, least squares) then CALIBRATES that Denver trend into actual Keystone
      # dollars, fit against this property's own known real reassessment values below. Every saved
      # number is already in USD -- Denver "index points" never leak past this calibration step.
      #
      # SCALING: for the CURRENT (pre-first-reassessment) period, the model reproduces initial_price
      # EXACTLY -- 0% uncertainty, never estimated, and never re-derived from the calibration line
      # even though that line is itself informed by this same value (see carrying_costs.py's own
      # docstring for the exact algebra guaranteeing this regardless of anything below). For every
      # LATER reassessment, the model applies the fitted calibration line to the Denver-metro
      # home_price index's own real/projected level -- see validation_data_source below for where
      # the line comes from.
      kind: market_value_schedule    # this block's own distinct shape -- NOT a single constant value
                                      #   (fixed 2026-09-29: `kind: constant` here was always wrong,
                                      #   just never actually checked -- see input_deck._expect_kind)
      initial_price: 555400          # example -- MUST be the property's actual price/assessed
                                      #   value AS OF THE CLOSING DATE (scenario.closing_month/
                                      #   closing_year), not today's or any other date's. This is
                                      #   the answer for right now -- never estimated.
      reassessment_frequency_years: 2
      first_reassessment_year: 1     # see the "REASSESSMENT MEANS..." note above -- must point to
                                      #   the NEXT (future) reassessment after closing, not the one
                                      #   already live and reflected in initial_price.
      latent: home_price
      validation_data_source: 166_Argentine_Ct_Unit1433_keystone_mkt_value.csv
                                      # Filename under data/manual/ holding this property's OWN past
                                      # real reassessment records (effective_year, the averaging
                                      # window it was based on, assessed_value -- see that file's
                                      # own format in data/manual/README.md), used to fit the
                                      # calibration line above (utils.prior_utils.
                                      # fit_market_value_calibration). The model ALSO automatically
                                      # includes a record for the CURRENT cycle, built from
                                      # initial_price/first_reassessment_year/
                                      # reassessment_frequency_years above -- don't duplicate that in
                                      # the CSV. With only 1 known point (no CSV data yet), the line
                                      # degenerates to a plain proportional scaling; with 2 it passes
                                      # through both exactly; with more, a real least-squares fit.
    mill_levy:
      # The parcel's own mill levies, one per component of the state's property-tax model (CO: local,
      # school), as plain fractions of ASSESSED value (not "mills" per $1,000): 38.219 mills = 0.038219.
      # Copy them from the parcel's tax bill or assessor page: levies are set per tax area (the county,
      # school district, fire, water/sanitation and metro districts covering the parcel), so they can
      # differ within one town. local = every levy that isn't the school district's. The Town of
      # Keystone itself levies 0 mills.
      local:
        kind: constant
        value: 0.038219               # example
      school:
        kind: constant
        value: 0.015343               # example

  hoa_dues_annual:
    # KNOWN-VALUE+GROWTH. initial_annual_dues and initial_annual_association_dues are both REAL truth
    # values -- what this property's HOA actually bills right now, not hand-tuned guesses -- so
    # there's 0% uncertainty about either at closing, exactly like market_value.initial_price. They're
    # COMBINED into one starting value (utils.prior_utils.build_hoa_dues_prior_model) that's projected
    # as a SINGLE draw from construction_cost's own fitted OU process, so the association charge
    # shares in the same growth and uncertainty as the rest, rather than being frozen at today's
    # dollar amount forever. No separate cv (a hand-picked cv would have been added as a CONSTANT
    # extra term at every horizon, including h=0, which is why an earlier version of this model's own
    # diagnostic plot never actually started at 0 uncertainty -- see build_hoa_dues_prior_model's own
    # docstring for the full root-cause writeup).
    #
    # NO FLOOR/CLAMP of any kind: an earlier version of this model enforced "dues only go up" with a
    # hard floor at the initial value, which the user correctly flagged as producing a mixed/censored
    # shape (a point mass at the floor plus a truncated lognormal above it), not a real lognormal one.
    # Removed -- construction_cost's own fitted drift is trusted as-is, a genuine unmodified lognormal.
    #
    # DISPLAY: the saved model.png/results plot show this as a MONTHLY stair-step (HOA dues are billed
    # monthly, not annually), splitting the grown combined total back into a flat recurring payment
    # for 11 months plus a taller January payment carrying the association share -- see
    # plotting.forecast_plots.plot_hoa_dues_monthly_stairstep.
    kind: known_plus_growth
    initial_annual_dues: 8700                  # example -- TODAY's actual annual HOA dues (the
                                                #   regular monthly-billed portion, annualized),
                                                #   exactly as billed -- not a guess
    initial_annual_association_dues: 325       # example -- TODAY's actual once-a-year special
                                                #   charge (e.g. a board-set capital-reserve line
                                                #   item) -- set to 0 if this property's HOA doesn't
                                                #   have one
    growth:
      latent: construction_cost

  special_assessment:
    # FREQUENCY x SIZE (redesigned 2026-11-22, replacing the old "annual probability x lognormal
    # severity" expected-value model). A special assessment is a rare, lumpy, one-off bill (a new
    # roof, siding, a reserve shortfall), so it is modeled as:
    #   - HOW MANY happen over the horizon: N ~ Poisson(annual_rate x horizon_years).
    #   - HOW BIG each one is: one of a few discrete size_scenarios, picked independently each time.
    #
    # EXCLUDED FROM EVERY CARRYING-COST TOTAL (total_carrying_costs, the monthly total band, and the
    # taxes stage's deductible expenses). Smearing a rare, large bill into a smooth yearly average
    # would hide exactly the risk it represents. Instead it gets its own plots, and will later be
    # applied as a TAIL-RISK OVERLAY on ΔW in final reporting (see .claude/implementation-plan.md's
    # "Final reporting: special-assessment overlay").
    #
    # TURNING IT OFF: set annual_rate: 0. There is no separate on/off switch.
    kind: frequency_severity
    annual_rate: 0.05                # example -- expected number of assessments PER YEAR (λ). Source
                                      #   it from the HOA's reserve study; it should be higher for older
                                      #   buildings or an underfunded reserve. 0.05 = about one every 20
                                      #   years on average. Must be >= 0.
    size_scenarios:
      # Possible sizes of ONE assessment, in TODAY's dollars. `probability` is the chance an assessment
      # is that size GIVEN that one happens, so the probabilities must add up to exactly 1. Amounts
      # must be >= 0 and labels must be unique.
      - label: minor
        amount_today_usd: 5000       # example
        probability: 0.7             # example
      - label: major
        amount_today_usd: 20000      # example
        probability: 0.3             # example
    growth:
      # Grows each size from today's dollars to the dollars of the month it's paid, using this latent's
      # MEDIAN growth path (construction_cost, the same driver hoa_dues_annual uses: assessments pay for
      # construction work). Set `latent: none` to keep sizes in today's dollars.
      latent: construction_cost
    timing: uniform                  # When assessments are assumed to be PAID. OPTIONS:
                                      #   uniform -- any month of the horizon is equally likely; sizes use
                                      #     the AVERAGE growth multiplier over the horizon.
                                      #   worst_case_year1 -- all paid right at closing (month 0): no size
                                      #     growth yet, but the longest time for that cash to have earned
                                      #     market returns instead -- the worst case for the later ΔW
                                      #     overlay.
    k_max: 3                         # The most assessments counted over the horizon (an integer >= 1).
                                      #   PLAIN-ENGLISH NOTE ON THE CUTOFF: the model only lists outcomes
                                      #   0, 1, ..., k_max. The small chance of MORE than k_max assessments
                                      #   is not thrown away -- it's FOLDED INTO the k_max outcome, so
                                      #   "k_max assessments" really means "k_max OR MORE". That keeps the
                                      #   probabilities adding up to 100%, but slightly UNDERSTATES the
                                      #   cost in those rare cases (4 assessments get counted as 3). Every
                                      #   run prints a WARNING if that folded-in chance is above 1% for a
                                      #   scenario -- if you see it, raise k_max.

  insurance_annual:
    # GUESS+GROWTH (moved here 2026-09-30 from a known-value shape -- a current insurance premium
    # turned out to also be an ESTIMATE, not known truth data the way hoa_dues_annual's dues are, so
    # it needs the same point-in-time-uncertainty treatment maintenance_annual already has).
    # initial_guess_premium is a best guess at this property's current premium (an STR-rated policy,
    # not a standard homeowner's policy); its own point-uncertainty is DERIVED from `latent`'s own
    # fitted process rather than a separately hand-picked cv (see
    # utils.prior_utils._build_guess_plus_growth_model). No floor/no-decrease assumption here (unlike
    # hoa_dues_annual): insurance premiums genuinely can fall, e.g. a real market softening.
    kind: guess_plus_growth
    initial_guess_premium: 1200      # example -- your best guess at this property's current annual
                                      #   premium (not a truth value)
    growth:
      latent: insurance

  utilities:
    # THREE-CATEGORY MODEL (redesigned 2026-11-22, replacing the temperature-sine seasonal shape). The
    # observed average bill below is split into three kinds of cost, each driven differently:
    #   1. FLAT: independent of temperature and occupancy (service charges, trash, TV/internet).
    #   2. OCCUPANCY-DRIVEN: scales with occupied days, not temperature (non-heating electric and gas,
    #      water).
    #   3. HEATING: scales with occupancy AND temperature (electric or gas space heat), via heating
    #      degree-days (HDD = how far the day's average outdoor temperature sits below the BALANCE
    #      POINT, the outdoor temperature at which the heat actually comes on). Each day type has its
    #      own thermostat setpoint (occupied_setpoint_f / vacant_setpoint_f, freeze protection when
    #      vacant).
    #
    # BALANCE POINT = setpoint - GAINS OFFSET. The unit's own non-heating electricity (lights,
    # appliances, fridge) ends up as heat indoors, so the heat comes on only below the setpoint minus
    # that offset. The offset is NOT an input: the build CALIBRATES it from this section's own numbers
    # (the electric bill's flat and occupancy-driven parts are the gains; the cost per heating degree-day
    # gives the unit's heat loss), separately for occupied days (all electric gains) and vacant days
    # (flat electric gains only). The calibrated values are saved in the utilities fit.json and shown on
    # its seasonal_shape.png. Needs electric heating (codes 1-3); see heating_type.
    #
    # Months whose AVERAGE temperature sits near the balance point still have colder days that need
    # heat, so expected HDD per day treats daily average temperatures as spread around the month's
    # average (normal distribution, daily_temperature_std_f): a month averaging exactly the balance
    # point heats on about half its days.
    #
    # CALIBRATION: the three categories are sized so that, under calibration_occupied_days_by_month,
    # one year of bills (before growth) adds up to EXACTLY 12 x initial_annual_average_monthly_cost.
    # Then each month's cost = flat + (cost per occupied day x occupied days) + (cost per heating
    # degree-day x that month's heating weight) + additional_flat_monthly, grown by `growth.latent`.
    # See utils.prior_utils.build_utilities_prior_model for the exact formulas.
    #
    # MONTHS ARE REAL CALENDAR MONTHS, anchored to scenario.closing_month: scenario month 0 is the
    # closing month (fixed 2026-11-22 -- utilities used to treat month 0 as January regardless).
    #
    # OCCUPANCY comes from other sections: occupied days per month = EXPECTED rented nights (the
    # mean of rental_operations' fitted occupancy prior, capped at the nights you leave available)
    # + personal_use.personal_use_days_by_month.
    kind: three_category
    initial_annual_average_monthly_cost: 119  # example -- the PREVIOUS OWNER's actual average monthly
                                               #   bill (annual total / 12), not any single month's
    calibration_occupied_days_by_month: history  # The occupancy the bill above was measured under.
                                               #   OPTIONS:
                                               #   `history` = the PREVIOUS owner's real occupancy: rented
                                               #     + owner nights per month, averaged over the included
                                               #     rental_operations.sources of kind: history that give
                                               #     owner_nights_by_month (e.g. the 2025 owner statement).
                                               #   `deck` = assume it was YOUR occupancy (rented + your
                                               #     personal use), i.e. the previous owner used the unit
                                               #     like you will.
                                               #   a 12-month map of occupied days, e.g.
                                               #     {jan: 25, feb: 22, ..., dec: 24}.
    components:
      # Each utility's share of the observed bill and how its NON-heating cost behaves.
      #   weight: share of the observed average bill (all weights must add up to 1). Set 0 for anything
      #     the HOA covers or the previous owner didn't pay.
      #   occupancy_fraction (0 to 1): share of this utility's NON-heating cost that scales with
      #     occupied days (category 2); the rest is flat (category 1). 0 = fully flat (e.g. trash),
      #     1 = fully occupancy-driven.
      electric: {weight: 0.80, occupancy_fraction: 0.6}   # example
      gas: {weight: 0.0, occupancy_fraction: 0.0}         # example
      water: {weight: 0.10, occupancy_fraction: 1.0}      # example
      sewer: {weight: 0.10, occupancy_fraction: 0.5}      # example
      trash: {weight: 0.0, occupancy_fraction: 0.0}       # example
      internet: {weight: 0.0, occupancy_fraction: 0.0}    # example
    heating_type: 1                  # example. OPTIONS (see carrying_costs.HEATING_TYPES for sources):
                                      #   0 = HOA/common heat (no heating cost on your bill)
                                      #   1 = electric resistance (baseboard/wall/radiant), COP 1.0
                                      #   2 = cold-climate heat pump, seasonal COP 2.0
                                      #   3 = standard heat pump with resistance backup, COP 1.5
                                      #   4 = gas furnace/boiler (+ 5% of the electric bill for the
                                      #       blower fan). NOT YET SUPPORTED by the gains-offset
                                      #       calibration (it would need a gas-to-electric price ratio);
                                      #       the build raises an error for code 4.
    heating_share: 0.55              # example -- fraction of the HEATING FUEL's own bill (electric for
                                      #   codes 1-3, gas for code 4) that is space heating, stated AS IF
                                      #   heated by electric resistance for codes 1-3 (heat-pump codes 2/3
                                      #   scale it down by their COP automatically) or by the furnace
                                      #   itself for code 4. 0.55 = engineering estimate for a resistance-
                                      #   heated condo at ~9,000 ft; gas-heated units typically run higher
                                      #   (~0.7-0.8). Best source: calibrate from a January and a July bill
                                      #   (method in .claude/implementation-plan.md). Ignored for code 0.
                                      #   Must be >= 0 and < 1.
    occupied_setpoint_f: 68          # example -- thermostat setting (F) on occupied days.
    vacant_setpoint_f: 50            # example -- thermostat setting (F) on vacant days (freeze
                                      #   protection). Must be <= occupied_setpoint_f.
    daily_temperature_std_f: 7       # example ESTIMATE -- standard deviation (F) of daily AVERAGE
                                      #   temperatures within a month (day-to-day weather swings, not
                                      #   the day/night swing). Only shapes the shoulder months. To be
                                      #   replaced by NOAA monthly heating degree-day normals (earmarked
                                      #   in the implementation plan), which need no spread assumption.
                                      #   Must be > 0.
    additional_flat_monthly: []      # NEW monthly costs (category 1, flat) that the previous owner did
                                      #   NOT pay or that weren't in the observed bill, e.g.
                                      #   [{label: guest_internet, amount_usd: 60}]. These are added ON
                                      #   TOP of the calibrated bill, so they INTENTIONALLY raise the total
                                      #   above the previous owner's average. Grown like everything else.
    seasonal_data_source: keystone_co_monthly_temperature_averages.csv
                                               # Filename under data/manual/ -- 12 rows (month,
                                               # avg_temp_f), each month's average of its average daily
                                               # high and low. The month's average temperature for
                                               # heating degree-days.
                                               # See data/manual/README.md for the source.
    growth:
      latent: utilities              # applied to every category, add-ons included

  maintenance_annual:
    # GUESS+GROWTH (redesigned 2026-09-29): unlike hoa_dues_annual/insurance_annual/utilities, there
    # is genuinely NO truth data for TODAY's maintenance cost -- initial_guess_mean is a real
    # hand-elicited GUESS (a rule of thumb like "~1% of purchase price" is a reasonable way to pick a
    # starting number, but enter a plain dollar figure here, deliberately NOT a fraction of the
    # condo's market value -- that dependency would mean this couldn't be pre-built once like the
    # other entries). Because it's a guess, not a truth value, there IS real point-in-time
    # uncertainty about it -- but rather than a separately hand-picked cv, that uncertainty is now
    # DERIVED directly from `latent`'s own fitted process (its own marginal/stationary rate variance,
    # sig^2*tau/2 -- see utils.prior_utils.build_maintenance_prior_model's own docstring for why this
    # is a reasonable stand-in for "how uncertain is a plausible guess about the level right now").
    # That derived uncertainty is a CONSTANT (doesn't compound with horizon) -- uncertainty in the
    # level NOW, not uncertainty further inflated by extrapolating over a long horizon.
    kind: guess_plus_growth
    initial_guess_mean: 2000          # example -- your best guess at today's actual annual
                                       #   maintenance cost (not a truth value)
    growth:
      latent: maintenance

# -----------------------------------------------------------------------------
# 7. rental_operations
# -----------------------------------------------------------------------------
# WHAT THIS SECTION DOES: predicts the unit's short-term-rental revenue. Monthly gross revenue =
# nights rented x average nightly rate (ADR) x ADR growth over the horizon. Net rental income =
# gross minus the two fees at the bottom of this section.
#
# WHAT YOU ENTER: `sources` -- every piece of rental data you have (owner statements, property-
# manager projections, market figures), each as ADR + occupancy, either for a whole year or month
# by month. You do NOT enter the prior itself (no median/cv): the model FITS it from your sources:
#   - Occupancy, per calendar month: the plain average and standard deviation of that month's
#     occupancy across every included source/year (zero months included) are matched to a
#     lognormal (cv = std / average). A month that is 0 in EVERY source is a hard 0.
#   - ADR, per calendar month: the same, using only sources that had bookings that month (a month
#     with no bookings has no ADR).
#   - A month with only one observation borrows the average cv of the other months (with a warning).
#   - The fitted spread is treated as year-to-year variation; the uncertainty in the fitted typical
#     value itself (spread / sqrt(number of observations)) is treated as persistent.
#   See src/condobuyuq2026/models/rental_operations_priors/ for the fit and plots of it against your
#   raw source values.
#
# YOUR OWN USE IS NOT ENTERED HERE: predictions use YOUR personal use (personal_use.
# personal_use_days_by_month, section 8). Occupancy is a RATE of nights available to rent, so a
# source's rate is applied to the nights YOU leave available: predicted rented nights per month =
# occupancy x (days in month - your personal-use days).
#
# LODGING TAX IS NOT MODELED, on purpose: enter every number BEFORE lodging tax (as owner statements
# and manager projections report them). Lodging tax (state + county + town sales/lodging taxes) is
# charged to the GUEST on top of the nightly rate and collected and remitted by the manager or
# booking platform, so it never reduces your income. (If you ever self-manage, you register and
# remit it yourself, but it's still the guest's money added on top of your rate.) The selected tax
# jurisdiction's layers list these guest taxes for reference (Keystone: 8.375% in total) -- see the
# run report and data/tax_jurisdictions/.
#
# tax_use_class (OPTIONS: personal_use | mixed_use | rental) is DERIVED -- not set anywhere in this
# deck (see classification.get_tax_use_class) -- from annual rented days (the fitted MEDIAN rented
# nights, summed over the year) and annual personal days (personal_use.personal_use_days_by_month,
# summed): rented <=14 days/year -> personal_use (rental income is tax-free); else personal use >14
# days/year OR >10% of rented days -> mixed_use (deductions capped at rental income, no loss
# allowed); else -> rental (a pure rental -- a loss is passive unless you materially participate;
# see taxes.average_guest_stay_nights). Thresholds come from data/tax_jurisdictions/federal.yaml.
# Independent of loan_occupancy_class.
rental_operations:
  managed_by:
    # Who runs the day-to-day rental (categorical). OPTIONS: self | company. Drives financing's
    # loan_occupancy_class when the property ISN'T your primary residence (see that section's
    # header comment) -- an STR run through a property manager ("company") is almost always an
    # investment loan; self-managed, occasional rental is a second-home loan.
    kind: constant
    value: company                   # example

  sources:
    # A LIST: add one entry per piece of rental data you have; there is no limit and no fixed set of
    # source types. Every entry has these fields:
    #   label:      any name, shown on the fit plots.
    #   include:    true | false. false leaves the entry in the deck but out of the fit (handy for
    #               trades, e.g. "what if I ignore the manager's projection?").
    #   kind:       history | estimate. history = what actually happened at THIS unit in one year
    #               (e.g. an owner statement). estimate = anything else (a manager's projection, a
    #               regional/market figure). Enter each year of history ONCE: monthly if you have
    #               it, otherwise annual.
    #   year:       the year the numbers are from. ADR is restated from that year's dollars to
    #               closing-date dollars using the `general` CPI data (forecast_models.general).
    #   resolution: annual | monthly. Then EITHER
    #     annual:   occupancy: <rate>, adr: <USD>   (one value each for the whole year), OR
    #     monthly:  months: {jan: {occupancy: <rate>, adr: <USD>}, ..., dec: {...}}  (all 12 months)
    #   owner_nights_by_month: OPTIONAL, history only -- the owner's own nights that year, by month.
    #               Not used for revenue (your own use comes from section 8); used to work out how
    #               many nights the unit was occupied when that year's utility bills were measured.
    #
    # occupancy = nights rented / nights AVAILABLE to rent (nights in the period minus the owner's
    #   own nights), a fraction from 0 to 1. E.g. 86 nights rented, 33 owner nights in a 365-night
    #   year: 86 / (365 - 33) = 0.259. If a source only gives nights rented, divide by the nights it
    #   assumed available (365 for a full year if it assumed no owner use).
    # adr = gross rental revenue / nights rented (USD per night, BEFORE lodging tax and before any
    #   fees). For a month with occupancy 0 there is no ADR: write `adr: null`.
    # Got a RANGE (e.g. "occupancy 30-45%")? Do the conversion yourself and enter one value (e.g.
    #   the midpoint); the fit measures disagreement between sources, not within one.
    - label: 2025 owner statement (Vail Properties)
      # REAL DATA: the seller's 2025 year-to-date owner statement, whose "year 2025" runs DEC 2024
      # through NOV 2025. Year total: $20,206.89 gross, 86 nights rented, 33 owner nights, 332
      # available -> occupancy 0.259, ADR $234.97. Monthly occupancy = nights rented / (days in
      # month - owner nights); ADR = the statement's "Avg Rent Rate" (gross / nights rented).
      include: true
      kind: history
      year: 2025
      resolution: monthly
      months:
        jan: {occupancy: 0.258, adr: 359.53}   #  8 / 31
        feb: {occupancy: 0.643, adr: 269.22}   # 18 / 28
        mar: {occupancy: 0.269, adr: 280.57}   #  7 / (31 - 5 owner)
        apr: {occupancy: 0.0, adr: null}       #  0 / 30  (shoulder season, no bookings)
        may: {occupancy: 0.0, adr: null}       #  0 / (31 - 4 owner)
        jun: {occupancy: 0.241, adr: 179.70}   #  7 / (30 - 1 owner)
        jul: {occupancy: 0.375, adr: 211.95}   #  9 / (31 - 7 owner)
        aug: {occupancy: 0.320, adr: 169.32}   #  8 / (31 - 6 owner)
        sep: {occupancy: 0.233, adr: 173.43}   #  7 / 30
        oct: {occupancy: 0.233, adr: 166.36}   #  7 / (31 - 1 owner)
        nov: {occupancy: 0.190, adr: 176.50}   #  4 / (30 - 9 owner)
        dec: {occupancy: 0.355, adr: 265.10}   # 11 / 31  (December 2024)
      owner_nights_by_month: {jan: 0, feb: 0, mar: 5, apr: 0, may: 4, jun: 1, jul: 7, aug: 6, sep: 0, oct: 1, nov: 9, dec: 0}

    - label: Property manager projection (EXAMPLE)
      # PLACEHOLDER -- example values, NOT real data. Replace with the property-specific monthly
      # projection table (rate and nights rented per month) once entered.
      include: true
      kind: estimate
      year: 2026
      resolution: monthly
      months:
        jan: {occupancy: 0.45, adr: 340}
        feb: {occupancy: 0.55, adr: 330}
        mar: {occupancy: 0.50, adr: 310}
        apr: {occupancy: 0.12, adr: 170}
        may: {occupancy: 0.08, adr: 160}
        jun: {occupancy: 0.30, adr: 190}
        jul: {occupancy: 0.45, adr: 220}
        aug: {occupancy: 0.40, adr: 200}
        sep: {occupancy: 0.30, adr: 180}
        oct: {occupancy: 0.20, adr: 165}
        nov: {occupancy: 0.20, adr: 175}
        dec: {occupancy: 0.45, adr: 300}

    - label: Regional 1b/1ba estimate (EXAMPLE)
      # PLACEHOLDER -- example values, NOT real data. Replace with the regional manager's annual
      # figures (convert their revenue/nights ranges to one occupancy and one ADR yourself).
      # An annual entry is spread over the 12 months using the average seasonal pattern of the
      # monthly sources above.
      include: true
      kind: estimate
      year: 2026
      resolution: annual
      occupancy: 0.35
      adr: 230

  occupancy_adr_correlation:
    # Correlation (-1 to 1) between a year's occupancy surprise and its ADR surprise -- e.g. a big
    # snow year that brings both more bookings AND higher rates is a positive correlation. 0 =
    # independent (default: there's too little history to estimate it reliably; the history
    # sources' own estimate is reported with the fit for reference).
    kind: constant
    value: 0.0

  adr_growth_latent:
    # Which derived latent grows ADR over the horizon (secular pricing power). ADR's level and
    # seasonal pattern come from `sources`; this only supplies the growth, using that latent's own
    # fitted growth path and uncertainty (see derived_latents.adr). No separate growth rate is
    # entered here.
    kind: constant
    value: adr

  channel_commission_fraction:
    # Booking-channel commissions (Airbnb/VRBO/travel-agent fees) as a fraction of GROSS rental
    # revenue, if your manager passes them through to you. Taken off FIRST. Set 0 if your manager's
    # fee already includes them. (For reference, Vail Properties' 2025 statement shows "Comms-Fees"
    # of ~0.048 of gross.)
    kind: constant
    value: 0.0                       # example -- a manager whose fee covers channel commissions

  mgmt_fee_fraction:
    # Property-management fee as a fraction of revenue AFTER channel commissions:
    #   net rental income = gross x (1 - channel_commission_fraction) x (1 - mgmt_fee_fraction).
    # Covers cleaning and platform costs too (no separate line items). E.g. 0.25 = the manager keeps
    # 25%. (For reference, Vail Properties' 2025 statement shows a 50/50 owner split: 0.50.)
    kind: constant
    value: 0.25                      # example -- quote from a full-service manager

# -----------------------------------------------------------------------------
# 8. personal_use
# -----------------------------------------------------------------------------
# WHAT THIS SECTION DOES: two plain estimates about YOUR OWN use of the place (buy branch).
#   1. How many nights a month you stay in the condo yourself.
#   2. What you'd pay each month for lodging somewhere else while the condo is busy being a rental.
# Nothing here is fitted from data; both are your own judgement, used exactly as entered.
personal_use:
  personal_use_days_by_month:
    # WHAT TO ENTER: nights per calendar month that YOU stay in the unit (whole numbers, 0 up to the
    # days in that month; February = 28). Same every year of the horizon. Friends/family stays that
    # aren't rented count here too (no separate field: small effect, not worth the complexity).
    # HOW IT'S USED (three places):
    #   - Rental cap (section 7): nights you leave available to rent = days in month - this. The
    #     fitted occupancy RATE is applied to those nights, so more personal use = fewer rented nights.
    #   - Tax use class (section 9): the year's total personal days vs rented days decides
    #     personal_use / mixed_use / rental (IRC 280A's 14-day / 10% tests). THIS CAN CHANGE YOUR TAXES.
    #   - Utilities (section 6): occupied days = expected rented nights + these days.
    kind: constant
    value:
      jan: 7                         # example — a ski week
      feb: 0
      mar: 0
      apr: 0
      may: 0
      jun: 3
      jul: 7                         # example — a summer week
      aug: 0
      sep: 0
      oct: 0
      nov: 0
      dec: 7                         # example — holidays

  alternate_lodging_cost_by_month:
    # WHAT TO ENTER: the dollars per calendar month YOU WILL PAY for lodging somewhere else (buy
    # branch only), in today's (closing-date) dollars. The rent branch pays for its own lodging instead
    # (rent_reference.lease_cost_by_month); this is what the buy branch spends to get whatever access
    # you want while your own unit is rented out.
    # IMPORTANT: EACH MONTH'S NUMBER IS CHARGED IN FULL, EVERY MONTH, as entered. The model does NOT
    # prorate it by your personal-use days above or by bookings. Work out the real cost yourself and
    # enter that. For example:
    #   - a full-month lease elsewhere, even though you still stay in the unit a night or two -> the
    #     full lease price;
    #   - lodging for about half the month -> about half the monthly price;
    #   - nights booked a few at a time -> nights you'd book x the nightly rate;
    #   - you wouldn't stay anywhere else that month -> 0.
    # Short-term/flexible lodging usually costs more per night than rent_reference.lease_cost_by_month's
    # lease.
    # HOW IT'S USED: each month's amount, grown by alternate_lodging_growth_latent from closing, is a
    # buy-branch cost in the final buy-vs-rent comparison. It is a PERSONAL cost: NOT tax-deductible
    # and NOT part of the carrying-cost totals. Shown in
    # results/<scenario>/personal_use/alternate_lodging_cost.png.
    kind: constant
    value:
      jan: 3200                      # example
      feb: 3200
      mar: 2800
      apr: 1600
      may: 1300
      jun: 1800
      jul: 2100
      aug: 2000
      sep: 1600
      oct: 1300
      nov: 1700
      dec: 3200

  alternate_lodging_growth_latent:
    # Which derived latent grows alternate_lodging_cost_by_month over the horizon. Default `adr`:
    # the same short-term-rental market as your own unit's nightly rate (derived_latents.adr), so
    # lodging costs and your ADR rise and fall together. Uses that latent's own fitted growth path
    # and uncertainty; no separate growth rate is entered here. The starting amounts above are
    # treated as known (no uncertainty of their own).
    kind: constant
    value: adr

# -----------------------------------------------------------------------------
# 9. taxes
# -----------------------------------------------------------------------------
# WHAT THIS SECTION DOES: works out how much the condo changes your household's income taxes, year by
# year and at the sale. Each year it computes your whole federal + state return twice, once WITHOUT the
# condo and once WITH it, and the difference is the condo's tax effect. That captures bracket jumps
# (e.g. a sale year pushing you into a higher bracket), the 0/15/20% capital-gain rates, the 3.8%
# investment-income tax, itemizing vs. the standard deduction, and the SALT cap, all automatically.
#
# THE LAW vs. YOUR FACTS: tax LAW (brackets, rates, caps, depreciation periods, property-tax mechanics,
# local taxes) is NOT entered here. It lives in sourced data files under data/tax_jurisdictions/, one
# per level (federal -> state -> county -> municipality), and `jurisdiction` below picks which ones
# apply. This section holds only facts about YOUR household and how the unit is rented.
#
# DISCLAIMER: directional, not a filing. Simplifications: tax tables held at 2026 values (in today's
# dollars, like household_agi); scenario years treated as calendar tax years; no other investment
# income assumed for the 3.8% tax; state additions/subtractions that don't involve this property
# ignored. Use a tax professional before relying on this for a filing decision.
taxes:
  jurisdiction:
    # Which tax layers apply to the PROPERTY, outermost first. Each names a folder under
    # data/tax_jurisdictions/: state -> <STATE>/state.yaml, county -> <STATE>/<county>/county.yaml,
    # municipality -> <STATE>/<county>/<municipality>/municipality.yaml. Federal is always on. Set county
    # or municipality to null to leave that layer off (unincorporated area, or a city that is its own
    # county). Available now: state CO; county summit; municipality keystone. state must match
    # scenario.property_state. Your residence state's own income tax (scenario.residency_state) is
    # loaded automatically from <STATE>/state.yaml (FL: none).
    kind: constant
    value:
      state: CO
      county: summit
      municipality: keystone

  filing_status:
    # OPTIONS: mfj (the only status the federal tables cover).
    kind: constant
    value: mfj

  household_agi:
    # Your household's adjusted gross income (USD/year) from everything EXCEPT this condo: wages,
    # business, other investments. Held flat over the horizon (in today's dollars). The model adds the
    # condo's rental income and sale gain on top of this to find which brackets they land in.
    kind: constant
    value: 450000                    # placeholder

  other_itemized_deductions:
    # Itemized deductions you'd have WITHOUT this condo, other than state/local taxes (USD/year):
    # e.g. mortgage interest on your main home, charitable gifts. Used to decide each year whether
    # itemizing beats the standard deduction, with and without the condo.
    kind: constant
    value: 0                         # placeholder

  other_salt_paid:
    # State and local taxes you already pay WITHOUT this condo (USD/year): your main home's property
    # tax, any state income tax on your other income. They share the SALT cap with the condo's
    # personal-share property tax. (FL residents: your Florida home's property tax.)
    kind: constant
    value: 6000                      # placeholder

  average_guest_stay_nights:
    # Your expected average guest booking length (nights per stay) once you own it. Decides two
    # federal rules (thresholds in data/tax_jurisdictions/federal.yaml):
    #   - <= 7 nights: NOT a "rental activity" for the passive-loss rules -> a pure-rental loss is passive
    #     unless you materially participate (see below); longer stays are a rental activity (passive, with
    #     a $25k allowance that phases out above $100k-$150k of income).
    #   - <= 30 nights: the unit is used on a "transient" basis -> the building depreciates over 39 years
    #     (nonresidential), not 27.5.
    # Keystone ski stays are typically a few nights, so any value <= 7 gives the same result.
    kind: constant
    value: 4                         # placeholder

  owner_materially_participates:
    # Whether YOU materially participate in running the rental (e.g. more than 500 hours/year, or at
    # least 100 hours and more than anyone else, managers and cleaners included). With a full-service
    # property manager (rental_operations.managed_by: company) this is essentially always false. Only
    # matters in the `rental` tax use class with average stays <= 7 nights: true lets a rental loss
    # offset your other income now; false suspends it until the sale.
    kind: constant
    value: false

# -----------------------------------------------------------------------------
# 10. rent_reference
# -----------------------------------------------------------------------------
# WHAT THIS SECTION DOES: what the RENT branch (you don't buy) pays for mountain lodging instead.
# It's the direct, ongoing alternative to owning: the buy branch has its condo (plus
# personal_use.alternate_lodging_cost_by_month), the rent branch has this.
rent_reference:
  lease_cost_by_month:
    # WHAT TO ENTER: the dollars per calendar month YOU WILL PAY to rent a comparable Keystone-area
    # place, in today's (closing-date) dollars. Any arrangement works, because you enter each month
    # yourself:
    #   - a 12-month lease -> its monthly rent every month;
    #   - month to month -> each month's month-to-month price (often higher in ski season);
    #   - a winter seasonal lease only -> the season's monthly rent in those months, 0 the rest.
    # ENTER IT ALL-IN: rent plus anything the lease doesn't include that you'd pay because you rent
    # (utilities, parking, fees, renter's insurance, ...). There are no separate fields for those.
    # A refundable security deposit is NOT a cost: leave it out.
    # IMPORTANT: EACH MONTH'S NUMBER IS CHARGED IN FULL, EVERY MONTH, as entered. The model does NOT
    # prorate it by personal_use_days_by_month or anything else (same rule as alternate lodging).
    # HOW IT'S USED: a rent-branch cost in the final buy-vs-rent comparison, grown by
    # lease_growth_latent. Rent goes up ONCE A YEAR, like a lease renewal, not every month: during
    # year 1 (the 12 months starting at closing) you pay exactly the amounts below. At each
    # anniversary of closing every month's amount steps up by the latent's growth so far, then holds
    # for the next 12 months. Your month-to-month pattern is kept; only its level rises. Rent is NOT
    # tax-deductible (federal or Colorado). Shown in results/<reference case>/rent_reference/
    # alt_lease_cost.png.
    kind: constant
    value:
      jan: 2200                      # example
      feb: 2200
      mar: 2000
      apr: 1200
      may: 1000
      jun: 1400
      jul: 1600
      aug: 1500
      sep: 1200
      oct: 1000
      nov: 1300
      dec: 2200

  lease_growth_latent:
    # Which derived latent grows lease_cost_by_month over the horizon (applied once a year; see
    # above). Default `adr`: the same Keystone rental market as your unit's nightly rate
    # (derived_latents.adr), so your rent and your ADR rise and fall together. Uses that latent's
    # own fitted growth path and uncertainty; no separate growth rate is entered here. The starting
    # amounts above are your own estimates, so they carry no uncertainty of their own.
    kind: constant
    value: adr

# -----------------------------------------------------------------------------
# 11. capital_markets
# -----------------------------------------------------------------------------
# WHAT THIS SECTION DOES: the RENT branch keeps your own cash instead of buying, and invests it.
# At closing it's split between a market account and a cash account (allocation), held to the
# horizon with no rebalancing, then sold. Along the way: cash earns interest, market holdings pay
# dividends; both are reinvested after tax. At the horizon the market account is sold and the gain
# is taxed. All taxes come from the same household tax engine and jurisdiction layers as section 9
# (taxes.household_agi etc.), using your residence state (scenario.residency_state).
# The same allocation, cash_yield and dividends also apply to the ΔW DIFFERENCE FUND (the monthly
# spending gap invested by whichever household spends less; see "HOW ΔW IS BUILT" at the top).
capital_markets:
  # The market's price growth comes from forecast_models.market (not re-declared here).
  initial_investment:
    # STUB — the amount is acquisition.personal_cash_at_closing (kept here only for discoverability,
    # same "SEE X" pattern as acquisition.purchase_price -> scenario.purchase_price). The rent branch
    # invests exactly YOUR OWN cash, not acquisition.family_loan (that loan only exists to fund a
    # purchase; it wouldn't be there to invest if you rented instead).
    kind: constant
    value: null                     # see acquisition.personal_cash_at_closing

  allocation:
    # WHAT TO ENTER: how initial_investment is split at closing, as fractions that add up to 1.
    #   market: invested in the broad market (forecast_models.market's price growth + dividends below);
    #   cash:   held as cash, earning cash_yield.
    # No rebalancing: each account grows on its own from closing to the horizon.
    kind: constant
    value:
      market: 0.8                    # example
      cash: 0.2                      # example

  cash_yield:
    # Annual interest rate on the cash account (fraction, e.g. 0.04 = 4%), held constant over the
    # horizon. Interest is taxed every year as ordinary income; the rest stays in the cash account.
    kind: constant
    value: 0.04                      # example

  dividends:
    # Dividends on the MARKET account (forecast_models.market is PRICE growth only, so dividends are
    # added here). Each year's dividends = paying_fraction x yield x the market account's value. They
    # are taxed every year as QUALIFIED dividends (long-term capital-gain rates + the 3.8% NIIT, and
    # ordinary rates in Colorado), and the after-tax amount is reinvested (it adds to your cost basis,
    # so it isn't taxed again at the sale).
    paying_fraction:
      # Fraction of the market account that pays dividends (0-1). 1 = everything pays at `yield`.
      kind: constant
      value: 1.0                     # example
    yield:
      # Annual dividend yield of the holdings that pay (fraction). The S&P 500's has been roughly
      # 1.2-1.5% in recent years; check a current figure for your own holdings.
      kind: constant
      value: 0.013                   # example

# -----------------------------------------------------------------------------
# 12. exit
# -----------------------------------------------------------------------------
# BOTH branches realize a taxable event at the horizon, always, not just the buy branch: the condo
# sells (selling_costs below; recapture and capital gains are taxed in section 9) AND the rent
# branch's portfolio is sold (its capital-gain tax is computed in section 11, capital_markets, by
# the same jurisdiction layers). Taxing the portfolio's sale too — not just letting its gains sit
# unrealized — is what makes ΔW an apples-to-apples comparison; otherwise the rent branch would look
# artificially better by never paying tax on its gains.
#
# WHAT THIS SECTION DOES: the buy branch's money at the sale (the mirror of capital_markets' after-
# tax portfolio), as a distribution:
#   net equity = sale price - selling costs - mortgage payoff - family loan (if
#                scenario.family_loan_repaid_at_sale) - sale tax
# Sale price: purchase_price grown by forecast_models.home_price to the horizon, with its full
# uncertainty band (lognormal). The mortgage payoff is the loan balance left at the horizon; the sale
# tax (recapture, capital gain, NIIT, state) comes from section 9's engine, worked out at every price
# across the band (so the bands and the mean are exact). Shown in results/<scenario>/exit/sale_proceeds.png.
# SALE TAX RULES (since 2026-11-25): the unit is split by its rental share (rented / (rented + personal)
# days) into a rental part and a personal part (IRS Pub. 527). A GAIN is taxed as usual when held more than
# 12 months (depreciation recapture, then long-term); held 12 months or less (a 1-year horizon) the whole
# gain is short-term, at ordinary rates. A LOSS: the personal part's share isn't deductible; the rental
# part's share is an ordinary loss that year (section 1231, IRS Pub. 544), so a loss-making sale can SAVE
# tax (shown as a negative sale tax).
exit:
  selling_costs:
    # total = fixed_fees + (percent_of_price * sale_price). Same composite pattern as
    # acquisition.purchase_closing_costs.
    # TRANSFER FEES (checked 2026-11-25): Colorado's constitution (TABOR, Art. X sec. 20(8)(a))
    # prohibits new or higher real-estate transfer taxes, so the Town of Keystone (2024) and Summit
    # County have none. The state documentary fee is 1 cent per $100 (about $40 on $400k). A PRIVATE
    # transfer fee can still be set by recorded covenants on a particular property (e.g. Silverthorne's
    # 1%); check this unit's title commitment/covenants and add any such fee to percent_of_price.
    fixed_fees:
      kind: constant
      value: 1500                    # example — title/escrow on the sell side
    percent_of_price:
      kind: constant
      value: 0.06                    # example — commission plus remaining closing costs

  # exit_year is DERIVED (equals scenario.horizon_years) — intentionally not entered here.

# -----------------------------------------------------------------------------
# 13. run
# -----------------------------------------------------------------------------
run:
  report_quantiles:
    # Quantiles to report in outputs (probability, 0-1). The first and last also set ΔW's reported band
    # (alongside P(buy beats rent) and a fixed 1%-99% outer band).
    kind: constant
    value: [0.1, 0.5, 0.9]
