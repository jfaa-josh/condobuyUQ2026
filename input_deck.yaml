# =============================================================================
# condobuyUQ2026 — Input Deck
# =============================================================================
# The single user-editable file describing the buy-vs-rent decision.
#
# STATUS: mostly illustrative example values now (not real elicited data — see each
# comment), so the deck can be run end to end. `# REQUIRED` still marks a real gap.
# See .claude/implementation-plan.md for stage, earmarks, and open questions.
#
# -----------------------------------------------------------------------------
# Schema reference
# -----------------------------------------------------------------------------
# WHAT THIS DECK COMPUTES: uncertainty propagation (forward UQ), not Bayesian inference —
# no posterior anywhere. Every input here feeds a deterministic formula whose OUTPUT is the
# actual quantity of interest: ΔW = W_buy − W_rent at the horizon.
#
# KIND:
#   constant   single known value.                fields: value
#   sweep      decision variable, grid axis.       fields: values
#   prior      ONE uncertain value, static.        fields: dist, <dist params>, latent
#   process    an entire time-evolving path, hand-elicited (dist/marginal params + monthly_change
#              inline) — not currently used by any forecast_models entry (all three are fitted now,
#              see below), kept here in case a future one goes back to being hand-elicited.
#
# All three founding processes (see below) have no `kind` at all: they're FITTED from real data
# instead of hand-elicited, so they carry none of the above fields — just `model_name`, naming an
# already-built model fit (see input_deck.py's get_forecast_model_general/
# get_forecast_model_home_price/get_forecast_model_market).
#
# DIST families: lognormal {median, cv} (positive quantities), normal {mean, sd} (can go
# negative — used for monthly_change blocks), mixture {p, severity: {dist: lognormal, median, cv}}
# (rare events).
#
# SWEEPS ARE DELIBERATELY MINIMAL: only `scenario.alternatives`, `scenario.horizon_years`,
# `scenario.residency_state`, and `scenario.purchase_price` are swept. Everything else is a
# single manually-set value per run.
#
# "SEE scenario.X" STUB PATTERN: `purchase_price` is actually swept in `scenario` (kept
# together with the other sweeps for visibility), but conceptually belongs to `acquisition`.
# That section keeps a named placeholder entry (`values: null # see scenario.purchase_price`)
# purely so the variable is discoverable when reading that section — the real input lives in
# `scenario`, don't set it in both places.
#
# ALWAYS SELLS AT THE HORIZON: not a toggle. Both branches are liquidated at exit_year — the
# buy branch sells the condo, the rent branch's invested portfolio is also sold — because
# taxing both liquidations (capital gains on the portfolio too, not just the condo) is what
# makes ΔW an apples-to-apples comparison. See scenario.horizon_years and the exit section.
#
# THREE FOUNDING PROCESSES (`forecast_models`: general, home_price, market) — all fitted from real
# historical data (see KIND above) as annualized GROWTH RATES (BLS CPI, a Denver-metro home price
# index, S&P 500 price — see the "annualized rate" note below). Treated as ground truth; nothing
# else in this deck feeds back and influences them.
#
# REFERENCING A PROCESS/DERIVED LATENT BY NAME: everywhere a `latent:` or `derived_latents.*.
# weights` key names a process (e.g. `market`, `construction_cost`, `general`), it's always that
# entry's own key under forecast_models/derived_latents — never a separate identifier declared on
# the entry itself.
#
# DERIVED LATENTS (`derived_latents`): for anything that needs a growth or level driver but
# isn't itself one of the three founding processes — a weighted combination of all three
# (`market`, `home_price`, `general`) plus its own idiosyncratic (unmodeled) share,
# `a²+b²+c² ≤ 1`. Deliberately kept as manually-reasoned weights for now — see the earmark
# in the implementation plan to fit these properly from real data with a utility script.
#
# `growth` sub-blocks are elicited as an ANNUAL median/cv, realized monthly internally, and COMPOUND
# over the horizon. Two shapes exist:
#   - `carrying_costs`'s five entries (`hoa_dues_annual`/`insurance_annual`/`maintenance_annual`/
#     `special_assessment`/`utilities`): `growth:` names ONLY a `latent:` — no separate `dist`/
#     `median`/`cv` of its own. The named latent's own already-fitted process supplies both the mean
#     growth and how its uncertainty widens/mean-reverts (see that section's header comment).
#   - Everywhere else (`rental_operations.adr.growth`, `rent_reference.seasonal_lease_cost.growth`,
#     `personal_use.alternate_lodging_cost_by_month.growth` — all `latent: adr`): `growth:` carries
#     its own hand-set `dist`/`median`/`cv` ALONGSIDE the latent. EARMARKED: this is the older,
#     redundant shape (the hand-set rate can silently disagree with the latent's own fitted rate) —
#     revisit the same way `carrying_costs` was, if/when worth doing.
#
# COMPOSITE COST FORMULAS (`acquisition.purchase_closing_costs`, `exit.selling_costs`): both follow
# `total = fixed_fees + (percent_of_price * price)` — a scalar dollar amount that doesn't scale
# with price, plus a fraction that does. Written out explicitly in each section's comment.
#
# `derived` variables (loan_amount, loan_occupancy_class, tax_use_class, exit_year,
# lease_days_equivalent, monthly rentable-nights) are computed by the script and deliberately do
# NOT appear in this deck.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. scenario
# -----------------------------------------------------------------------------
# Every sweep in this deck lives here: alternatives x horizon_years x residency_state x
# purchase_price is the full run — watch the combined count as you add values to any of these.
scenario:
  reference:
    # Baseline being compared against. OPTIONS: rent (fixed).
    kind: constant
    value: rent

  alternatives:
    # OPTIONS: buy.
    kind: sweep
    values: [buy]

  horizon_years:
    # Years held before both branches cash out. ALWAYS ends in a sale/liquidation at exit_year —
    # not a toggle (see the "ALWAYS SELLS AT THE HORIZON" note in the schema reference above):
    # the buy branch sells the condo AND the rent branch's portfolio is liquidated, both taxed,
    # so the comparison is apples-to-apples rather than favoring whichever side doesn't realize
    # its gains.
    kind: sweep
    values: [1, 5, 10]

  residency_state:
    # Tax domicile (categorical). OPTIONS: FL | CO. Applies to both branches symmetrically —
    # see taxes.state_tax_profiles.
    kind: sweep
    values: [FL]

  property_state:
    # Where the condo (or the rent branch's comparable place) sits. Fixed for this scenario.
    kind: constant
    value: CO

  purchase_price:
    # Purchase price (USD) — the deck's actual input for this; see the "SEE scenario.X" note
    # above. acquisition.purchase_price is a discoverability stub only.
    kind: sweep
    values: [375000, 400000]

  closing_month:
    # Month (1-12) the purchase closes. Together with closing_year below, this is TIMESTEP 0 for
    # every month-indexed model in this deck (currently just carrying_costs.property_tax.
    # market_value's own stair-step -- see that field's own comment) -- everything else still only
    # ever tracks integer months FROM this point, never a real calendar date beyond it. closing_
    # month/year exist only so a calculation that genuinely needs to know a REAL calendar month
    # (e.g. how many months until reassessment year 1's January, or which historical month a
    # pre-closing data lookup needs) has a fixed reference point to count from.
    kind: constant
    value: 10                      # example — October
  closing_year:
    kind: constant
    value: 2026                    # example

# -----------------------------------------------------------------------------
# 2. forecast_models
# -----------------------------------------------------------------------------
# The three founding processes. All fitted from real data (BLS CPI, a Denver-metro Case-Shiller
# home price index, S&P 500 price) and modeled as ANNUALIZED GROWTH RATES (see the "annualized
# rate" note just below).
#
# IMPORTANT — annualized rate, but a MONTHLY-stepped process: the growth rate's own distribution is
# on an ANNUALIZED basis (e.g. median 0.03 = "running about 3%/year") — that's the natural, human-
# elicited way to state it, or what these fits are expressed in (see their own comments below). But
# each process's path is a MONTHLY AR(1) walk (see "Temporal model" in
# .claude/implementation-plan.md): the fit's equivalent of `monthly_change` is how much that
# ANNUALIZED-RATE ESTIMATE itself typically drifts from one month's reading to the next's — that's
# what phi gets fit from — it is NOT the amount actually applied to grow a variable's IC in a
# single month. When this growth compounds an IC forward, each of the 12 monthly steps in a year
# must apply the MONTHLY-EQUIVALENT of the annual rate (the twelve steps compound TO the annual
# rate), never the full annual figure at every one of the 12 steps — that would compound to twelve
# years of growth in one. The exact monthly-step formula given phi is still open — see
# "Calibration procedure" under Open questions in the implementation plan.
forecast_models:
  general:
    # General (broad US urban consumer) CPI inflation, expressed as an ANNUALIZED rate — see the
    # forecast_models header note above for what that means for how this actually steps monthly.
    # Covers CPI-U, all items, not seasonally adjusted. Does NOT cover Summit-County-specific costs
    # (see home_price) or this property's own utility/HOA cost drivers (those are their own
    # derived_latents entries, e.g. construction_cost/insurance/maintenance).
    #
    # This one and home_price below are FITTED from real data rather than hand-elicited: model_name
    # just names a fit already built and saved by run/manual/build_general_price_model.py to
    # models/<model_name>/fit.json (see input_deck.py's get_forecast_model_general and
    # .claude/implementation-plan.md's Earmarks for how the fit's OU parameters map onto this
    # model). No kind/dist/mean/sd/monthly_change here -- they come from the fit, not the deck.
    model_name: bls_cpi_all_nsa_1984_1_2026_8

  home_price:
    # Local Denver-METRO home price appreciation (fraction/year), NOT national CPI and NOT
    # Summit-County/Keystone-specific (no dedicated mountain-resort-town index exists -- treated as
    # the best available proxy). Used directly (unweighted) to appreciate acquisition.purchase_price
    # to its sale value at exit -- see exit section.
    #
    # FITTED from real FRED data (S&P/Case-Shiller Denver-Metro HPI, NSA) -- see general's comment
    # above for what that means; fit built and saved by run/manual/build_co_home_price_model.py.
    model_name: fred_denver_homes_1987_1_2026_8

  market:
    # Broad portfolio return (fraction/year) — the rent branch's opportunity-cost engine. This
    # IS capital_markets' "market_return"; not re-declared there, to avoid two copies of the
    # same numbers. PRICE return only (no dividends) -- see build_market_model.py's own docstring
    # for why that's a known, deliberate understatement of real portfolio growth, not an oversight.
    #
    # FITTED from real Yahoo Finance data (S&P 500, ^GSPC) -- see general's comment above for what
    # that means; fit built and saved by run/manual/build_market_model.py.
    model_name: yfinance_spx_1984_1_2026_9

# -----------------------------------------------------------------------------
# 3. derived_latents
# -----------------------------------------------------------------------------
# For anything that needs a growth or level driver but isn't itself a founding process:
# construction_cost and insurance drive both a LEVEL and a GROWTH role (see their own comments
# below); maintenance drives a LEVEL only; adr and utilities each drive a GROWTH only (their LEVEL/
# seasonal shape is just their own `months:` map — see rental_operations.adr/carrying_costs.
# utilities). Each entry is a weighted combination of all three forecast_models' own standardized
# monthly paths -- referenced by their own key (`market`/`home_price`/`general`), same as
# everywhere else in this deck (see "Referencing a process/derived latent by name" above), not a
# separate `z_*` identifier -- plus an idiosyncratic share, for latent X with weights {a, b, c}:
#
#   X_t = a*market_t + b*home_price_t + c*general_t + sqrt(1 - a^2 - b^2 - c^2)*shock_idio_t
#
# a^2+b^2+c^2 <= 1 (checked by input_deck.py's get_derived_latents); the shortfall is X's own
# idiosyncratic (unmodeled, i.i.d. each month, no persistence of its own) variance. EARMARKED (see
# implementation plan): weights below are manually reasoned placeholders; the plan is to build
# these properly in an offline utility script (with visualizations) against real occupancy/ADR/
# utilities data, and import the result here instead of hand-setting weights.
derived_latents:
  construction_cost:
    # Drives hoa_dues_annual's and special_assessment's (severity's) GROWTH -- their multi-year
    # drift, not their own year-to-year LEVEL deviation (see carrying_costs section's own header
    # comment for why there's no longer a LEVEL-driving latent on either).
    weights:
      market: 0.0                     # REQUIRED (placeholder) — 0 to 1 each, sum of squares <= 1
      home_price: 0.6
      general: 0.4

  insurance:
    # Drives insurance_annual's GROWTH (same role as construction_cost's, see that entry's comment).
    weights:
      market: 0.0
      home_price: 0.9
      general: 0.1

  maintenance:
    # Drives maintenance_annual's growth (see carrying_costs section).
    weights:
      market: 0.0
      home_price: 0.5
      general: 0.5

  adr:
    # Drives adr's GROWTH (secular pricing power) — adr's LEVEL/seasonal shape is just its own
    # `months:` map (see rental_operations.adr). ALSO reused for rent_reference.
    # seasonal_lease_cost's growth and personal_use.alternate_lodging_cost_by_month's growth —
    # same rental market, so the same pricing-power process applies to all three.
    weights:
      market: 0.2
      home_price: 0.5
      general: 0.3

  utilities:
    # Drives utilities' GROWTH — utilities' LEVEL/seasonal shape is just its own `months:` map.
    weights:
      market: 0.3
      home_price: 0.0
      general: 0.7

# -----------------------------------------------------------------------------
# 4. acquisition
# -----------------------------------------------------------------------------
acquisition:
  purchase_price:
    # STUB — actual input lives in scenario.purchase_price (a sweep). Kept here only so this
    # variable is discoverable when reading this section; do not set values here.
    kind: sweep
    values: null                     # see scenario.purchase_price

  purchase_closing_costs:
    # total = fixed_fees + (percent_of_price * purchase_price). Named "purchase_" (not just
    # "closing_costs") to stay unambiguous against exit.selling_costs, which is the sell-side
    # closing costs.
    # fixed_fees: dollar costs independent of price (title insurance, escrow, recording,
    #   attorney fees, etc.). percent_of_price: costs that scale with price (loan origination
    #   points, transfer tax, etc.).
    fixed_fees:
      kind: constant
      value: 2500                    # example
    percent_of_price:
      kind: constant
      value: 0.0                   # example — 1.5%

  land_fraction:
    # Share of the purchase price attributable to LAND, not the building (fraction) — needed
    # because the IRS only lets you depreciate the BUILDING/structure, never the land under it,
    # so purchase_price must be split into a depreciable (building) and non-depreciable (land)
    # portion for tax purposes. Find this on your county assessor's property record: it
    # typically shows an assessed "land value" and "improvement value" (building) separately —
    # use that SAME ratio here regardless of what you actually paid. Example: assessor shows
    # $80k land / $320k building on a $400k assessed value -> land_fraction = 0.20.
    kind: constant
    value: 0.0      # Opposite of % improved

  personal_cash_at_closing:
    # YOUR OWN money going toward closing (down payment, not from family_loan below) -- this IS the
    # rent branch's opportunity-cost capital (see capital_markets.initial_investment, which imports
    # this same value): unlike a family loan, your own cash wouldn't evaporate if you rented
    # instead, so it's what you'd invest in that branch. total_cash_outlay (DERIVED, see
    # acquisition.compute_acquisition_costs) = this + family_loan; the amount financed is DERIVED
    # from that: purchase_price + purchase_closing_costs.fixed_fees + (purchase_closing_costs.
    # percent_of_price * purchase_price) - total_cash_outlay.
    kind: constant
    value: 200000

  family_loan:
    kind: constant
    value: 100000

  initial_furnishing:
    # One-time STR setup/furnishing cost (USD), scalar — a cash outlay only, not depreciated for
    # tax purposes (not a large enough amount to be worth the added complexity). Not the same
    # thing as any furnishing cost the rent branch might need (not currently modeled there).
    kind: constant
    value: 0

# -----------------------------------------------------------------------------
# 5. financing
# -----------------------------------------------------------------------------
# loan_occupancy_class (OPTIONS: primary_residence | second_home | investment) is DERIVED, not set
# here (see classification.get_loan_occupancy_class): primary_residence iff scenario.residency_
# state == scenario.property_state (a CO resident living in the CO property; FL residency can
# NEVER be primary, however many days you spend there); otherwise second_home if rental_operations.
# managed_by is "self" (you occupy it part of the year, no rental program/property manager
# controlling who stays there), or investment if managed_by is "company" (an STR run through a
# property manager is almost always this). "Second home" is really a LENDER term -- the tax code's
# own classification is tax_use_class below, decided by day counts, not by who manages the
# property or where you live.
financing:
  mortgage_rate:
    # One rate per loan_occupancy_class -- confirm with an actual lender; a half-year STR schedule
    # may push a self-managed property into "investment" territory regardless of intent (see
    # rental_operations.managed_by).
    primary_residence:
      kind: constant
      value: 0.0625
    second_home:
      kind: constant
      value: 0.065
    investment:
      kind: constant
      value: 0.0725                  # 0.5-1 point over second_home typical for STR (property manager)

  non_warrantable_premium:
    # Added ON TOP of whichever mortgage_rate above applies, if the condo project itself isn't
    # warrantable (Fannie/Freddie-eligible) -- 0.0 if it is (the common case; confirm with the
    # HOA/a lender before assuming otherwise).
    kind: constant
    value: 0.0

  loan_term_years:
    kind: constant
    value: 30

# -----------------------------------------------------------------------------
# 6. carrying_costs
# -----------------------------------------------------------------------------
# LEVEL + GROWTH pattern (hoa_dues_annual, insurance_annual, maintenance_annual, special_assessment,
# utilities): each has a hand-elicited LEVEL (`dist: lognormal, median, cv` -- tune by hand, no
# `latent:` of its own) and a `growth:` block naming ONLY a `latent:` (construction_cost/insurance/
# maintenance/utilities, per entry) -- no separate growth `dist`/`median`/`cv`. The named latent's
# own fit (models/derived_variables/<latent>/fit.json, already built) supplies BOTH the mean growth
# AND how its own uncertainty widens/mean-reverts over the horizon, via the exact closed-form
# machinery forecast_models already uses (ou_fitting.project_term_structure, called with p0 = the
# LEVEL's median). The level's own `cv` becomes a separate, CONSTANT (non-compounding) log-variance
# added on top -- see project_term_structure's `extra_log_variance` parameter and
# manual_utils.build_carrying_cost_prior for exactly how these combine (the level's own year-to-year
# deviation and the multi-year growth trend are deliberately two different processes, not one).
#
# Built the same way `derived_latents` are (see that section) -- NOT read directly from the deck at
# runtime: manual_utils.build_all_carrying_cost_prior_models combines each entry's level + growth
# latent into a saved projection (models/carrying_cost_priors/<name>/fit.json + plot), rebuilt
# automatically every time run/main.py runs (so an edit here always takes effect on the next run,
# without needing a separate manual step) -- carrying_costs.py then just loads the result.
carrying_costs:
  property_tax:
    # Colorado's REAL two-step system (assessed value = market_value x assessment_rate, then tax =
    # assessed value x mill_levy), with LOCAL and SCHOOL each their own assessment_rate/mill_levy
    # (see assessment_rate below) applied to a different FRACTION of market_value (see
    # carrying_costs.py's LOCAL_ASSESSED_VALUE_FRACTION/SCHOOL_ASSESSED_VALUE_FRACTION -- 90%/100%
    # respectively, hardcoded there rather than deck fields, same reasoning as classification just
    # below). Only the COMBINED total (local + school) is ever passed on to a scenario -- the
    # local/school split itself is an internal computation detail, not exposed.
    #
    # classification (residential | lodging) and the lodging assessment rate are HARDCODED in
    # carrying_costs.py (PROPERTY_TAX_CLASSIFICATION/LODGING_ASSESSMENT_RATE), NOT deck fields, and
    # NOT auto-derived from rental_operations.managed_by/financing.loan_occupancy_class: there is NO
    # current CO law tying property-tax classification to rental activity -- two bills that would
    # have (HB24-1299: owner-occupancy test; SB24-033: a 90-rented-days/year threshold) both DIED in
    # committee in 2024, and Summit County STRs are still taxed at the residential rate today
    # regardless of rental activity -- see
    # https://propertytaxrates.org/blog/colorado-property-tax-guide-2026 and
    # https://leg.colorado.gov/bills/sb24-033. "residential" is simply the only currently-real
    # option, so hardcoding it needs no deck-level toggle; revisit if that law ever changes.
    market_value:
      # The COUNTY ASSESSOR'S OWN determination of market value for property-tax purposes -- NOT
      # the same thing as this model's own sale-price projection (carrying_costs.
      # project_condo_value_schedule, which tracks TRUE ongoing appreciation continuously via
      # forecast_models.home_price). Deliberately NOT the LEVEL+GROWTH pattern the other
      # carrying_costs entries use (no median/cv of its own) -- instead, the assessed value is
      # STAIR-STEPPED, anchored to scenario.closing_month/closing_year (timestep 0) rather than a
      # real calendar date read at run time, and each new step is an AVERAGE over part of the prior
      # assessment window, not a single point -- see carrying_costs.project_market_value_schedule
      # for the exact mechanism. Concretely:
      #   - From closing until January of (closing_year + first_reassessment_year), the value is
      #     exactly initial_price -- constant and fully known (no county reassessment has happened
      #     yet).
      #   - At that first reassessment (month 1 of the target year) and every
      #     reassessment_frequency_years after, the new value is the AVERAGE of the market's own
      #     growth over the first 1.5 years (18 months) of the 2-year assessment window that's
      #     ENDING at this reassessment -- e.g. a reassessment on Jan 1 2025 (with
      #     reassessment_frequency_years=2) uses the average of Jan 2023-Jun 2024, then holds that
      #     new value constant until the Jan 2027 reassessment.
      #   - Whatever part of that 18-month averaging window falls BEFORE closing uses REAL
      #     historical market data (not a projection); whatever part falls after closing uses
      #     `latent`'s own projected distribution -- so if e.g. 80% of a window is already-recorded
      #     history, only the remaining 20% contributes any uncertainty to that reassessment's value.
      # `initial_price` scales the WHOLE stair-stepped path (a plain multiplier, not a distribution
      # of its own) -- all of this entry's own uncertainty comes from `latent`'s fitted process.
      kind: constant
      initial_price: 555400          # example -- MUST be the property's actual price/assessed
                                      #   value AS OF THE CLOSING DATE (scenario.closing_month/
                                      #   closing_year), not today's or any other date's -- every
                                      #   projection below is anchored to that exact month.
      reassessment_frequency_years: 2
      first_reassessment_year: 2     # 1 = the calendar year immediately following closing (i.e.
                                      #   reassessment on Jan 1 of closing_year+1); 2 = the year
                                      #   after that; etc. Reassessment always lands on month 1
                                      #   (January) of the target year.
      latent: home_price
    assessment_rate:
      # LOCAL and SCHOOL are Colorado's own two, separately-set components (each its own
      # assessment_rate AND mill_levy -- see this field's own header comment for how they combine).
      local:
        rate:
          kind: constant
          value: 0.068                # example — CO 2026 local-government residential assessment rate
        mill_levy:
          # Summit County's own local-government mill levy, expressed as a plain fraction of
          # ASSESSED value (not a dollars-per-$1000 "mills" figure) -- e.g. 38.219 mills = 0.038219.
          kind: constant
          value: 0.038219             # example
      school:
        rate:
          kind: constant
          value: 0.0705               # example — CO 2026 school-district residential assessment rate
        mill_levy:
          # Summit County's own school-district mill levy, same units as local's above.
          kind: constant
          value: 0.015343             # example

  hoa_dues_annual:
    # Annual HOA dues (USD) -- typical current-year level (tune by hand); growth via
    # construction_cost's own fitted process (see this section's header comment).
    kind: prior
    dist: lognormal
    median: 9600                     # example — $800/month
    cv: 0.15
    growth:
      latent: construction_cost

  special_assessment:
    # Rare-event mixture: p = annual probability, severity = dollar cost if it occurs. GROWTH grows
    # severity's own median via construction_cost -- a special assessment years from now should
    # cost more in nominal dollars, for the same reason HOA dues do. p itself is NOT grown (the
    # chance of a bad year isn't modeled as trending).
    kind: prior
    dist: mixture
    p: 0.05                          # example — annual probability
    severity:
      dist: lognormal
      median: 5000
      cv: 0.5
    growth:
      latent: construction_cost

  insurance_annual:
    # Must reflect an STR-rated policy, not a standard homeowner's policy. LEVEL/GROWTH pattern --
    # see this section's header comment.
    kind: prior
    dist: lognormal
    median: 3500
    cv: 0.20
    growth:
      latent: insurance

  utilities:
    # Monthly (USD), seasonal shape (winter heating spike) via its own `months:` map -- no shared
    # level-driving latent (each month's own median/cv IS the level). GROWTH scales every month's
    # median by the SAME year's growth factor (construction_cost's own fitted process would be the
    # wrong latent here -- utilities has its own, see derived_latents.utilities), preserving the
    # seasonal shape while the overall level inflates over the horizon.
    kind: prior
    dist: lognormal
    resolution: monthly
    months:
      jan: {median: 320, cv: 0.2}
      feb: {median: 300, cv: 0.2}
      mar: {median: 250, cv: 0.2}
      apr: {median: 180, cv: 0.2}
      may: {median: 130, cv: 0.2}
      jun: {median: 110, cv: 0.2}
      jul: {median: 110, cv: 0.2}
      aug: {median: 120, cv: 0.2}
      sep: {median: 130, cv: 0.2}
      oct: {median: 160, cv: 0.2}
      nov: {median: 220, cv: 0.2}
      dec: {median: 300, cv: 0.2}
    growth:
      latent: utilities

  maintenance_annual:
    # Annual maintenance (USD) -- a flat dollar LEVEL, deliberately NOT a fraction of the condo's
    # market value (that dependency would mean this couldn't be pre-built once like hoa_dues_annual/
    # insurance_annual). median is a flat dollar estimate (a rule of thumb like "~1% of purchase
    # price" is a reasonable way to pick a starting number, but pick a plain dollar figure here).
    kind: prior
    dist: lognormal
    median: 2000
    cv: 0.25
    growth:
      latent: maintenance

# -----------------------------------------------------------------------------
# 7. rental_operations
# -----------------------------------------------------------------------------
# managed_by below drives financing's loan_occupancy_class (see that section's header comment).
# tax_use_class (OPTIONS: personal_use | mixed_use | rental) is ALSO DERIVED -- not set anywhere in
# this deck (see classification.get_tax_use_class) -- from annual_rented_days (this section's own
# occupancy medians, summed over the year) and annual_personal_days (personal_use.
# personal_use_days_by_month, summed): rented <=14 days/year -> personal_use (rental income is tax-
# free); else personal use >14 days/year OR >10% of rented days -> mixed_use (deductions capped at
# rental income, no loss allowed); else -> rental (a pure rental -- losses suspended, released at
# sale). Independent of loan_occupancy_class and of taxes.passive_loss_treatment (a DIFFERENT IRS
# test -- average-guest-stay length, not day counts -- still to be wired into the future taxes
# module alongside this).
rental_operations:
  managed_by:
    # Who runs the day-to-day rental (categorical). OPTIONS: self | company. Drives financing's
    # loan_occupancy_class when the property ISN'T your primary residence (see that section's
    # header comment) -- an STR run through a property manager ("company") is almost always an
    # investment loan; self-managed, occasional rental is a second-home loan.
    kind: constant
    value: company                   # example

  occupancy:
    # DAYS booked per month, not a fraction/percent — matches personal_use_days_by_month's unit
    # convention. median is a whole number of days; cv stays a plain fraction describing
    # relative spread (the underlying quantity being integer-valued doesn't require cv itself to
    # be one). Bounded above by (days in that calendar month - personal_use_days_by_month for
    # that month) — this bound must be computed dynamically by the loader per actual month/year
    # (28, 29 in a leap year, 30, or 31 days), not hardcoded here; lognormal draws get rounded to
    # the nearest whole day downstream. Seasonal shape via its own `months:` map below -- no shared
    # level-driving latent with adr. No growth — a day-count doesn't have a secular multi-year
    # trend the way dollar figures do.
    kind: prior
    dist: lognormal
    resolution: monthly
    months:
      jan: {median: 22, cv: 0.15}
      feb: {median: 20, cv: 0.15}
      mar: {median: 20, cv: 0.15}
      apr: {median: 10, cv: 0.25}
      may: {median: 9, cv: 0.25}
      jun: {median: 15, cv: 0.20}
      jul: {median: 18, cv: 0.20}
      aug: {median: 17, cv: 0.20}
      sep: {median: 10, cv: 0.25}
      oct: {median: 9, cv: 0.25}
      nov: {median: 12, cv: 0.20}
      dec: {median: 21, cv: 0.15}

  adr:
    # USD/night, monthly seasonal shape via its own `months:` map below -- no shared level-driving
    # latent with occupancy anymore (see occupancy's own comment). Growth (secular pricing power)
    # via the richer `adr` derived latent instead.
    kind: prior
    dist: lognormal
    resolution: monthly
    months:
      jan: {median: 420, cv: 0.20}
      feb: {median: 440, cv: 0.20}
      mar: {median: 400, cv: 0.20}
      apr: {median: 220, cv: 0.20}
      may: {median: 180, cv: 0.20}
      jun: {median: 210, cv: 0.20}
      jul: {median: 230, cv: 0.20}
      aug: {median: 220, cv: 0.20}
      sep: {median: 190, cv: 0.20}
      oct: {median: 180, cv: 0.20}
      nov: {median: 210, cv: 0.20}
      dec: {median: 400, cv: 0.20}
    growth:
      kind: prior
      dist: lognormal
      latent: adr
      median: 0.04
      cv: 0.3

  mgmt_fee_fraction:
    # Property-management fee (fraction of revenue) — also covers cleaning and platform fees
    # (no separate line items for those).
    kind: constant
    value: 0.25                      # example — full-service PM

  lodging_tax_rate:
    # Combined state, county, and town rate.
    kind: constant
    value: 0.088                     # example — Summit County / Keystone area, ballpark

# -----------------------------------------------------------------------------
# 8. personal_use
# -----------------------------------------------------------------------------
personal_use:
  personal_use_days_by_month:
    # Days per month YOU personally occupy the unit (not available to rent that month).
    # This effects tax class designation of the property!
    # Rentable nights per month is DERIVED (days in month - this). Friends/family use is
    # deliberately not modeled separately (small effect, not worth the complexity per the user).
    kind: constant
    value:
      jan: 7                         # example — a ski week
      feb: 0
      mar: 0
      apr: 0
      may: 0
      jun: 3
      jul: 7                         # example — a summer week
      aug: 0
      sep: 0
      oct: 0
      nov: 0
      dec: 7                         # example — holidays

  alternate_lodging_cost_by_month:
    # Buy branch only: months the condo is generating STR income (not personal_use_days_by_month
    # and not your own stay) are months you'd need to pay for lodging elsewhere if you want the
    # same flexible mountain access the rent branch has all year round (rent_reference.
    # seasonal_lease_cost assumes a full-year lease). Same IC + growth pattern as
    # seasonal_lease_cost, reusing the same `adr` derived latent (same rental market) — but a
    # HIGHER per-month rate than seasonal_lease_cost's, since this is short-term/flexible
    # lodging, not a locked-in annual lease. Applies pro-rated to whatever portion of each month
    # isn't covered by personal_use_days_by_month — exact proration rule TBD (see implementation
    # plan).
    kind: constant
    value:
      jan: 3200                      # example
      feb: 3200
      mar: 2800
      apr: 1600
      may: 1300
      jun: 1800
      jul: 2100
      aug: 2000
      sep: 1600
      oct: 1300
      nov: 1700
      dec: 3200
    growth:
      kind: prior
      dist: lognormal
      latent: adr
      median: 0.04
      cv: 0.3

# -----------------------------------------------------------------------------
# 9. taxes
# -----------------------------------------------------------------------------
# DISCLAIMER: this is NOT a full IRS return simulation. `federal_marginal_rate` below is a
# single fixed rate applied throughout — if rental income/gains actually push you into a HIGHER
# federal bracket, that escalation is NOT captured here. Treat all tax outputs as directional,
# not authoritative; use a real tax professional before relying on this for a filing decision.
taxes:
  filing_status:
    # OPTIONS: mfj (others not yet supported).
    kind: constant
    value: mfj

  federal_marginal_rate:
    # Your top federal tax bracket rate (fraction) — the rate on your LAST dollar of income,
    # used to value deductions (mortgage interest, depreciation, rental losses). See the
    # disclaimer above — this is fixed, not a simulated bracket schedule.
    kind: constant
    value: 0.32                      # example

  niit_applies:
    # Whether household MAGI exceeds the Net Investment Income Tax threshold ($250k MFJ) --
    # a fixed structural assumption, same spirit as federal_marginal_rate (not derived from an
    # actual income simulation, which is out of scope -- see this section's disclaimer).
    kind: constant
    value: true                      # example

  niit_rate:
    # Net Investment Income Tax rate (fraction) -- applies to net rental income and capital gains
    # when niit_applies above.
    kind: constant
    value: 0.038

  itemizes_deductions:
    # Whether the household itemizes deductions (Schedule A) rather than taking the standard
    # deduction -- determines whether the PERSONAL share of mortgage interest/property tax
    # (the share NOT allocated to rental use) yields any tax benefit at all.
    kind: constant
    value: false                     # example

  state_tax_profiles:
    # One bundle per state, looked up via scenario.residency_state — replaces a bare tax-rate
    # field with everything state-specific in one place, so picking CO automatically pulls in
    # CO's whole tax treatment rather than several separately-scattered fields.
    kind: constant
    value:
      FL:
        income_tax_rate: 0.0
        capital_gains_as_ordinary_income: false
      CO:
        income_tax_rate: 0.044       # example — flat rate, TABOR refunds have lowered it some years
        capital_gains_as_ordinary_income: true   # CO taxes gains as ordinary income at the rate above

  salt_cap:
    # SALT = the federal itemized-deduction cap on state + local taxes (property tax, state
    # income tax) you can deduct against FEDERAL taxable income. Simplified to one flat number
    # rather than a year-indexed schedule — this has been genuinely unsettled in recent tax
    # law, so treat this as a placeholder to double-check against current law, not a firm fact.
    kind: constant
    value: 10000                     # example — verify against current-year law

  depreciation_years_building:
    kind: constant
    value: 27.5                      # residential rental, per current law

  recapture_rate:
    kind: constant
    value: 0.25                      # max on unrecaptured Section 1250 gain

  ltcg_rate:
    # Federal only; applies to both the condo sale and portfolio liquidation. CO's capital-gains
    # treatment is handled via state_tax_profiles above.
    kind: constant
    value: 0.15                      # example

  sec121_exclusion:
    # Section 121 primary-residence capital-gains exclusion (USD, MFJ) -- only applies when
    # loan_occupancy_class (see financing section) is primary_residence AND the property's been
    # held >= sec121_min_years below. Verify against current-year law, same spirit as salt_cap.
    kind: constant
    value: 500000

  sec121_min_years:
    # Ownership-and-use test for the exclusion above.
    kind: constant
    value: 2

  passive_loss_treatment:
    # Largely DETERMINED, not a free choice: an average stay of 7 days or less (a fixed fact for
    # this STR, not modeled as a variable) takes the activity outside the "rental activity"
    # passive-loss rules entirely, regardless of participation hours. Participation level can
    # still matter for other classifications, hence still a field rather than fully hardcoded.
    kind: constant
    value: non_passive_short_term_rental   # example — confirm with a tax professional

# -----------------------------------------------------------------------------
# 10. rent_reference
# -----------------------------------------------------------------------------
rent_reference:
  seasonal_lease_cost:
    # The rent branch means renting a comparable Keystone-area place FULL YEAR (not just for
    # personal_use_days_by_month) — the direct, ongoing alternative to buying. Monthly IC values
    # below; not swept (just a year-1 anchor — no need for multiple market scenarios). Growth
    # uses the `adr` derived latent, NOT a fresh latent of its own: you're a landlord in this
    # same market either way (buy branch's STR pricing), so reusing `adr` is both simpler and
    # more correct than inventing a separate process for the same market.
    kind: constant
    value:
      jan: 2200                      # example
      feb: 2200
      mar: 2000
      apr: 1200
      may: 1000
      jun: 1400
      jul: 1600
      aug: 1500
      sep: 1200
      oct: 1000
      nov: 1300
      dec: 2200
    growth:
      kind: prior
      dist: lognormal
      latent: adr
      median: 0.04
      cv: 0.3

  # lease_days_equivalent is DERIVED (matches personal_use.personal_use_days_by_month) —
  # intentionally not entered here.

# -----------------------------------------------------------------------------
# 11. capital_markets
# -----------------------------------------------------------------------------
capital_markets:
  # market_return lives entirely in forecast_models.market now — not re-declared here.
  initial_investment:
    # STUB — actual input lives in acquisition.personal_cash_at_closing (kept here only for
    # discoverability, same "SEE X" pattern as acquisition.purchase_price -> scenario.purchase_
    # price). The rent branch invests exactly YOUR OWN cash, not acquisition.family_loan (that loan
    # only exists to fund a purchase -- it wouldn't be sitting around to invest if you rented
    # instead). Split between cash and market per cash_allocation_fraction below.
    kind: constant
    value: null                     # see acquisition.personal_cash_at_closing

  cash_allocation_fraction:
    # Fraction of initial_investment held as CASH (earning cash_yield) rather than invested in
    # the broader market (earning forecast_models.market). E.g. 0.1 = 10% cash reserve, 90%
    # invested.
    kind: constant
    value: 0.1                       # example

  cash_yield:
    # Yield on the CASH portion only (fraction) — see cash_allocation_fraction.
    kind: constant
    value: 0.04

  portfolio_tax_drag:
    # Annual tax drag on dividends/turnover — applies ONLY to the market-invested portion (see
    # cash_allocation_fraction), not the cash portion. See implementation plan for this scoping
    # note.
    kind: constant
    value: 0.15                      # example — blended effective annual drag

# -----------------------------------------------------------------------------
# 12. exit
# -----------------------------------------------------------------------------
# BOTH branches realize a taxable event here, always, not just the buy branch: the condo sells
# (selling_costs + recapture + capital gains) AND the rent branch's capital_markets.
# initial_investment portfolio is liquidated (capital gains via taxes.ltcg_rate). Taxing the
# portfolio's liquidation too — not just letting its gains sit unrealized — is what makes ΔW an
# apples-to-apples comparison; otherwise the rent branch would look artificially better by never
# paying tax on its gains.
exit:
  selling_costs:
    # total = fixed_fees + (percent_of_price * sale_price). Sale price is DERIVED: purchase_price
    # appreciated via forecast_models.home_price to exit_year. Same composite pattern as
    # acquisition.purchase_closing_costs.
    fixed_fees:
      kind: constant
      value: 1500                    # example — title/escrow on the sell side
    percent_of_price:
      kind: constant
      value: 0.06                    # example — commission plus remaining closing costs

  # exit_year is DERIVED (equals scenario.horizon_years) — intentionally not entered here.

# -----------------------------------------------------------------------------
# 13. run
# -----------------------------------------------------------------------------
run:
  report_quantiles:
    # Quantiles to report in outputs (probability, 0-1).
    kind: constant
    value: [0.1, 0.5, 0.9]
